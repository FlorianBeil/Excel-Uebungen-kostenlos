  h1, h2, h3, h4 { font-family: var(--font-heading); margin: 0; color: var(--text-primary); }

  header.site-header {
    background: linear-gradient(135deg, var(--excel-green) 0%, var(--excel-green-dark) 100%);
    color: #fff;
    padding: 0.6rem 1.5rem;
  }

  .site-header__inner { max-width: 1500px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }

  /* "← Alle Übungen": nur sichtbar, wenn eine einzelne Übung geöffnet ist —
     genau wie der Zurück-Link auf der echten Übungsseite des Portals. */
  .site-header__back {
    font-family: var(--font-body);
    font-size: 0.9rem;
    text-decoration: none;
    color: #fff;
    opacity: 0.9;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.4rem 0.75rem;
    border-radius: 999px;
    transition: background 0.12s ease;
  }
  .site-header__back:hover { background: rgba(255, 255, 255, 0.24); }

  main { max-width: 1500px; margin: 0 auto; padding: 0.7rem 1.5rem; display: flex; flex-direction: column; gap: 0.5rem; }

  /* #overview-view/#exercise-workspace sind jeweils EIN Kind von <main> —
     main's eigenes gap wirkt also nur zwischen den beiden (sich gegenseitig
     ausschließenden) Bereichen, nicht innerhalb. Eigener, großzügigerer
     Abstand zwischen Hero/Tabs/Karten bzw. Aufgabe/Tabelle/Aktionen. */
  /* container-type hier (statt z.B. auf .exercise-picker selbst) — Container
     Queries können nicht auf die eigene Größe reagieren, brauchen also einen
     Vorfahren als Bezugsrahmen (siehe .exercise-picker weiter unten). */
  #overview-view { display: flex; flex-direction: column; gap: 1.6rem; container-type: inline-size; }
  #exercise-workspace { display: flex; flex-direction: column; gap: 1.3rem; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1.1rem 1.3rem;
    box-shadow: 0 1px 2px rgba(16,124,65,0.06), 0 4px 14px rgba(16,124,65,0.06);
  }

  /* ---------- Marke im Header (1:1 aus dem Übungsportal übernommen) ---------- */
  .brand { display: flex; align-items: center; gap: 0.65rem; }
  .brand__icon { width: 22px; height: 26px; display: block; flex-shrink: 0; }
  .brand__icon svg { width: 100%; height: 100%; display: block; }
  .brand__wordmark { font-family: var(--font-heading); font-weight: 600; font-size: 1.1rem; letter-spacing: -0.01em; }
  .brand__wordmark .dot { opacity: 0.75; }

  /* ---------- Hero-Text über den Stufen (wie "Dein Übungsportal ..." im
     echten Portal) ---------- */
  .page-intro { margin: 0.4rem 0 0.2rem; }
  .page-intro h1 { font-size: 1.4rem; margin: 0 0 0.35rem; font-family: var(--font-heading); }
  .page-intro p { margin: 0; color: var(--text-muted); max-width: 620px; font-size: 0.86rem; }

  /* ---------- Stufen-Tabs + Übungsauswahl je Stufe (1:1 aus dem
     Übungsportal übernommen: gleiche Pillen-/Karten-Optik inkl. Fortschritt) ---------- */
  .level-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 0.6rem;
  }

  .level-tabs {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .level-tab {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.85rem;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.4rem 0.85rem;
    border-radius: 999px;
    border: 1.5px solid var(--border-color);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
  }
  .level-tab:hover { border-color: var(--excel-green); color: var(--excel-green-dark); }
  .level-tab.is-active { background: var(--excel-green); border-color: var(--excel-green); color: #fff; }
  .level-tab__count { font-family: var(--font-mono); font-size: 0.72rem; opacity: 0.85; }

  .level-reset__btn {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.8rem;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 1.5px solid var(--border-color);
    background: var(--surface);
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color 0.12s ease, color 0.12s ease, background 0.12s ease;
  }
  .level-reset__btn:hover { border-color: var(--error-red); color: var(--error-red); background: var(--error-red-tint); }

  /* Explizit gestuftes Raster (statt auto-fill/minmax) per Container Query —
     die Seite läuft in einem Ablefy-iframe, dessen tatsächlich verfügbare
     Breite eine Viewport-Media-Query nicht zuverlässig widerspiegelt (siehe
     #overview-view: container-type weiter unten). Ohne @container-Treffer
     (sehr schmaler Container) bleibt es bei einer Spalte. */
  .exercise-picker {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0.9rem;
  }
  @container (min-width: 700px) {
    .exercise-picker { grid-template-columns: repeat(2, 1fr); }
  }
  @container (min-width: 1000px) {
    .exercise-picker { grid-template-columns: repeat(3, 1fr); }
  }

  .exercise-card {
    background: var(--surface);
    border: 1px solid var(--border-color);
    border-radius: var(--radius);
    padding: 1rem 1.1rem;
    display: flex;
    flex-direction: column;
    gap: 0.55rem;
    text-align: left;
    text-decoration: none;
    color: inherit;
    cursor: pointer;
    font-family: var(--font-body);
    box-shadow: 0 1px 2px rgba(16,124,65,0.06), 0 4px 14px rgba(16,124,65,0.06);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  .exercise-card:hover { transform: translateY(-2px); border-color: var(--excel-green); box-shadow: 0 6px 20px rgba(16,124,65,0.14); }
  .exercise-card.is-active { border-color: var(--excel-green); box-shadow: 0 0 0 1px var(--excel-green); }
  .exercise-card.is-done { border-color: #BFE8CE; }

  .exercise-card__badges { display: flex; gap: 0.4rem; flex-wrap: wrap; }
  .badge {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    padding: 0.2rem 0.5rem;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge--category { background: var(--excel-green-tint); color: var(--excel-green-dark); }
  .badge--done { background: #E9F6EE; color: var(--success-green); }

  /* Positionsangabe ("2 von 5") — reine Orientierungshilfe, deshalb bewusst
     kleiner/heller als Titel und ohne Pill-Optik (kein .badge), damit sie
     nicht mit der Kategorie konkurriert. margin-left:auto schiebt sie im
     bestehenden Flex-Badges-Row nach rechts, ohne die Badges links
     anzufassen. */
  .exercise-card__position {
    margin-left: auto;
    font-family: var(--font-body);
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--text-muted);
    white-space: nowrap;
  }

  .exercise-card__title { font-weight: 600; font-size: 1rem; color: var(--text-primary); }
  .exercise-card__desc { margin: 0; font-size: 0.84rem; color: var(--text-muted); line-height: 1.3; flex-grow: 1; }
  .exercise-card__cta { font-family: var(--font-body); font-weight: 600; font-size: 0.84rem; color: var(--excel-green); }

  /* Platzhalter für eine Stufe, die noch keine Übung hat (z.B. Profi) */
  .level-empty {
    background: var(--header-gray);
    border: 1px dashed var(--grid-gray);
    border-radius: var(--radius);
    padding: 1.1rem 1.3rem;
    text-align: center;
  }
  .level-empty p {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.86rem;
    font-style: italic;
  }

  /* Kompakter als eine normale .card: die Aufgabenbeschreibung soll möglichst
     wenig vertikalen Platz beanspruchen, damit mehr Raum für das Arbeitsblatt bleibt. */
  .task-card {
    padding: 0.45rem 0.85rem;
  }

  .task-card h2 { font-size: 1.05rem; margin-bottom: 0.15rem; }
  .task-card p { margin: 0.1rem 0; color: var(--text-primary); font-size: 0.9rem; line-height: 1.35; }
  .task-card .goal { color: var(--text-muted); font-size: 0.86rem; }

  .hints-toggle {
    margin-top: 0.2rem;
    background: none;
    border: none;
    color: var(--excel-green-dark);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
    padding: 0;
  }

  .hints-box {
    display: none;
    margin-top: 0.3rem;
    background: var(--excel-green-tint);
    border: 1px solid var(--excel-green);
    border-radius: 8px;
    padding: 0.45rem 0.65rem;
    font-size: 0.86rem;
  }
  .hints-box.open { display: block; }
  .hints-box ul { margin: 0.25rem 0 0; padding-left: 1.1rem; }

  /* ---------- Datenquelle: einklappbar, standardmäßig zu (siehe
     data-source-box[hidden] im HTML) — gleiches Toggle-Muster wie
     .hints-toggle/.hints-box oben. ---------- */
  .data-source-toggle {
    background: none;
    border: none;
    color: var(--excel-green-dark);
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 0.86rem;
    cursor: pointer;
    padding: 0;
  }

  .data-source-box {
    margin-top: 0.5rem;
  }

  /* Höhe für Kopfzeile + ca. 8 Datenzeilen — alles darüber hinaus scrollt
     innerhalb der Box selbst (siehe .sheet-wrap: overflow:auto), nie der
     Container oder gar die ganze Seite. Zusammengesetzter Selektor (statt nur
     .sheet-wrap--capped), damit das kürzere max-height zuverlässig über der
     allgemeinen .sheet-wrap-Regel gewinnt, unabhängig von der Reihenfolge im
     Stylesheet. */
  .sheet-wrap.sheet-wrap--capped {
    max-height: 300px;
  }

  /* ---------- Excel-Fenster: Pivot-Vorschau links, PivotTable-Feldliste
     rechts. Die Quelldaten-Tabelle lebt separat in der einklappbaren
     .data-source-card weiter unten (siehe dort) — container-type hier, weil
     die Seite in einem Ablefy-iframe läuft, dessen tatsächlich verfügbare
     Breite eine Viewport-Media-Query nicht zuverlässig widerspiegelt. */
  .excel-window { padding: 0; overflow: hidden; container-type: inline-size; }

  .excel-body {
    display: flex;
    align-items: stretch;
  }

  /* Unter 900px Container-Breite: Feldliste über die Pivot-Vorschau stapeln
     (column-reverse statt column, damit die im DOM zweite .pivot-fields-panel
     optisch nach oben wandert, ohne die Reihenfolge im Markup anzufassen). */
  @container (max-width: 900px) {
    .excel-body { flex-direction: column-reverse; }
    /* Höhere Spezifität als die Basisregel .pivot-fields-panel (width:280px,
       weiter unten im Stylesheet definiert) nötig, sonst gewinnt bei
       gleicher Spezifität die spätere Regel unabhängig von der
       Container Query. */
    .excel-body .pivot-fields-panel { width: 100%; align-self: stretch; }
  }

  .sheet-caption {
    margin: 0;
    padding: 0.5rem 0.9rem;
    font-size: 0.76rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border-color);
  }

  /* ---------- Arbeitsblatt-Look: Spaltenbuchstaben, Zeilennummern, volle
     Gitternetzlinien, scharfe Ecken. Ungescoped (nicht mehr nur innerhalb
     .excel-body), da .sheet-wrap jetzt auch für die eigenständige
     Datenquelle-Tabelle weiter unten verwendet wird — flex/min-width wirken
     dort einfach nicht (kein Flex-Elternelement), overflow/max-height aber
     genauso wie hier. ---------- */
  .sheet-wrap {
    position: relative;
    flex: 1;
    min-width: 0;
    max-height: 560px; /* = .pivot-fields-panel, das im Excel-Stil höher ist */
    overflow: auto;
    border: none;
    border-radius: 0;
  }

  /* Hinweistext, solange noch kein Zeilen-/Spaltenfeld abgelegt wurde —
     schwebt zentriert über dem (jetzt von Anfang an sichtbaren) leeren
     Raster, siehe renderPivot(). Absolut positioniert relativ zu
     .sheet-wrap (position:relative) mit festem top-Wert statt top:50%,
     damit er unabhängig vom Scroll-Zustand des ggf. mehrzeiligen Rasters
     immer im initial sichtbaren Bereich bleibt. Nur ein kleiner, leicht
     transparenter Hintergrund direkt hinter dem Text (nicht die ganze
     Fläche) — das Raster bleibt dadurch überall sonst unverdeckt sichtbar. */
  .pivot-empty-hint {
    position: absolute;
    top: 160px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: 320px;
    padding: 0.9rem 1.2rem;
    background: rgba(255, 255, 255, 0.88);
    border-radius: 10px;
    text-align: center;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 0.86rem;
    line-height: 1.4;
    pointer-events: none;
  }

  /* ---------- Filter-Bereich: auswählbar, öffnet ein echtes Dropdown ---------- */
  .filter-value-cell {
    cursor: pointer;
  }
  .filter-value-cell:hover {
    background: #cfe0f2 !important;
  }
  /* Echter Excel-Filterknopf statt eines reinen Textpfeils: kleines
     weißes Quadrat mit Rahmen und einem dunklen Dreieck darin — sowohl
     im Filter-Bereich (neben "(Alle)") als auch neben "Zeilenbeschriftungen"
     in der Pivot-Kopfzeile. */
  .pivot-filter-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1em;
    height: 1em;
    margin-left: 5px;
    border: 1px solid #8896A3;
    border-radius: 2px;
    background: #fff;
    vertical-align: middle;
  }
  .pivot-filter-btn::after {
    content: "";
    width: 0;
    height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-top: 4px solid #43494F;
  }
  .filter-value-cell:hover .pivot-filter-btn { border-color: var(--excel-green-dark); }

  .filter-dropdown {
    position: absolute;
    z-index: 5;
    min-width: 140px;
    max-width: 220px;
    max-height: 220px;
    overflow-y: auto;
    background: #fff;
    border: 1px solid var(--grid-gray);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
    font-family: var(--font-body);
    font-size: 0.8rem;
  }

  .filter-dropdown__item {
    padding: 0.3rem 0.6rem;
    cursor: pointer;
    white-space: nowrap;
  }
  .filter-dropdown__item:hover {
    background: var(--excel-green-tint);
  }
  .filter-dropdown__item.active {
    background: var(--excel-blue-tint);
    font-weight: 600;
  }

  /* Zeilenbeschriftungen-Zelle: wie der Filter-Bereich klickbar, öffnet aber
     das größere Excel-Sortier-/Filtermenü statt der einfachen Werteliste. */
  .rowlabel-filter-cell { cursor: pointer; }
  .rowlabel-filter-cell:hover .pivot-filter-btn { border-color: var(--excel-green-dark); }

  /* ---------- Zeilenbeschriftungen: Sortier-/Filtermenü (Excel-Nachbau) ---------- */
  .rowlabel-filter-menu {
    position: absolute;
    z-index: 6;
    width: 250px;
    background: #fff;
    border: 1px solid var(--grid-gray);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    font-family: var(--font-body);
    font-size: 0.8rem;
    color: var(--text-primary);
    padding: 0.25rem 0;
  }

  /* Rechtsklick-Kontextmenü auf einer Wertezelle: "Werte anzeigen als" */
  .value-context-menu {
    position: absolute;
    z-index: 6;
    min-width: 210px;
    background: #fff;
    border: 1px solid var(--grid-gray);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    font-family: var(--font-body);
    font-size: 0.8rem;
    color: var(--text-primary);
    padding: 0.25rem 0;
  }
  .vcm-header {
    padding: 0.3rem 0.7rem;
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    border-bottom: 1px solid var(--border-color);
    margin-bottom: 0.2rem;
  }
  .vcm-check { color: var(--excel-green); float: right; }
  .rlm-item {
    padding: 0.3rem 0.7rem;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.4rem;
  }
  .rlm-item:hover { background: var(--excel-green-tint); }
  .rlm-item--disabled {
    color: var(--text-muted);
    cursor: default;
    pointer-events: none;
  }
  .rlm-arrow { color: var(--text-muted); }
  .rlm-sep {
    height: 1px;
    background: var(--border-color);
    margin: 0.25rem 0;
  }
  .rlm-search-wrap { padding: 0.15rem 0.7rem 0.4rem; }
  .rlm-search {
    width: 100%;
    box-sizing: border-box;
    border: 1px solid var(--grid-gray);
    border-radius: 3px;
    padding: 0.25rem 0.45rem;
    font-family: var(--font-body);
    font-size: 0.78rem;
  }
  .rlm-list {
    max-height: 180px;
    overflow-y: auto;
    border-top: 1px solid var(--border-color);
    border-bottom: 1px solid var(--border-color);
    padding: 0.2rem 0;
    margin-bottom: 0.4rem;
  }
  .rlm-check-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.2rem 0.7rem;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .rlm-check-row:hover { background: var(--excel-green-tint); }
  .rlm-check-row input { margin: 0; flex-shrink: 0; }
  .rlm-actions {
    display: flex;
    justify-content: flex-end;
    gap: 0.4rem;
    padding: 0 0.7rem;
  }
  /* Wertefilter: eingeklapptes Mini-Formular (Top/Unten N nach Wertefeld) */
  .rlm-vf-badge { color: var(--excel-green); }
  .rlm-valuefilter { padding: 0.3rem 0.7rem 0.5rem; display: flex; flex-direction: column; gap: 0.35rem; }
  .rlm-vf-row { display: flex; align-items: center; gap: 0.35rem; }
  .rlm-vf-label { color: var(--text-muted); font-size: 0.76rem; }
  .rlm-vf-row select, .rlm-vf-field-select, .rlm-vf-row input {
    font-family: var(--font-body);
    font-size: 0.78rem;
    border: 1px solid var(--grid-gray);
    border-radius: 3px;
    padding: 0.2rem 0.35rem;
  }
  .rlm-vf-row input { width: 3.5rem; }
  .rlm-vf-field-select { width: 100%; }
  .rlm-vf-actions { display: flex; gap: 0.4rem; }
  .rlm-btn {
    border: 1px solid var(--grid-gray);
    background: #fff;
    border-radius: 3px;
    padding: 0.25rem 0.7rem;
    font-family: var(--font-body);
    font-size: 0.78rem;
    cursor: pointer;
  }
  .rlm-btn:hover { background: var(--header-gray); }
  .rlm-btn--primary {
    background: var(--excel-green);
    border-color: var(--excel-green);
    color: #fff;
  }
  .rlm-btn--primary:hover { background: var(--excel-green-dark); }

  table.sheet-table {
    /* separate statt collapse: mit vielen position:sticky-Zellen (Spalten-
       buchstaben, Zeilennummern, Kopf-/Filterzeilen) lässt Chrome bei
       collapse gelegentlich genau die vertikalen Ränder sticky-positionierter
       Zellen verschwinden (bekannter Rendering-Fehler) — mit separate
       bekommt jede Zelle ihren eigenen, unabhängig gemalten Rand, das
       Zusammenlegen entfällt und damit auch der Fehler.
       Der äußere obere/linke Rand kommt vom table-Element selbst, jede
       Zelle steuert nur ihren rechten/unteren Rand bei (siehe unten) —
       sonst wären interne Ränder doppelt so dick wie der Außenrand. */
    border-collapse: separate;
    border-spacing: 0;
    border-top: 1px solid var(--grid-gray);
    border-left: 1px solid var(--grid-gray);
    /* Kein width:100% — sonst zwingt das die Spalten, sich auf die volle
       Breite des Arbeitsblatts aufzublähen, statt sich an ihrem Inhalt zu
       orientieren (besonders sichtbar, wenn die Pivot-Spalten noch leer
       sind: dann fließt der komplette überschüssige Platz in A–C). */
    width: auto;
    font-size: 14px;
    font-family: var(--font-excel);
    color: #1F1F1F;
  }

  table.sheet-table th, table.sheet-table td {
    border: 0;
    border-right: 1px solid var(--grid-gray);
    border-bottom: 1px solid var(--grid-gray);
    padding: 0.26rem 0.4rem;
    white-space: nowrap;
    background: #fff; /* einheitlicher Zellhintergrund, keine Zebra-Streifen */
    /* Einheitliche Standardbreite für jede Spalte, ob mit oder ohne Inhalt —
       sonst fallen leere (Lücken-/Pivot-Platzhalter-)Spalten neben A–C winzig
       aus. Zeilennummern-/Eckzelle bewusst ausgenommen, siehe unten. */
    min-width: 92px;
  }

  /* "Kopfzellen-Look" (Grau, fette Schrift ohne Monospace) hängt bewusst am
     <th>-Tag selbst, nicht an der Zeile — sonst würde jede Zelle, die nur
     zufällig eine fixierte Zeile teilt (z. B. eine Quelldaten-Datenzeile
     neben einer zweiten Pivot-Kopfzeile), fälschlich grau eingefärbt. */
  /* Inhaltliche Überschriften (z. B. Feldnamen der Datenquelle) wie in einem
     echten Excel-Blatt: nur fett, keine graue Füllung — grau sind nur die
     Spaltenbuchstaben/Zeilennummern (siehe unten). */
  table.sheet-table th {
    text-align: center;
    background: #fff;
    font-family: var(--font-excel);
    font-weight: 700;
  }
  table.sheet-table td { text-align: right; }
  table.sheet-table .rowlabel { text-align: left; font-weight: 500; }
  /* Überschriften bleiben fett, auch wenn sie als Text-Spalte linksbündig sind
     (sonst wären „Datum/Region/…“ dünner als „Umsatz“) */
  table.sheet-table th.rowlabel { font-weight: 700; }

  /* Gruppierte Zeilen (zwei Felder in derselben Zone, z.B. Region + Land
     beide in Zeilen): eingerückte, ein-/ausklappbare Gliederung wie in
     echtem Excel statt einer flach kombinierten "Region / Land"-Zeile. */
  table.sheet-table .rowlabel.row-indent-1 { padding-left: 1.5rem; }
  table.sheet-table .rowlabel.row-indent-2 { padding-left: 2.6rem; }
  table.sheet-table .rowlabel.row-indent-3 { padding-left: 3.7rem; }
  table.sheet-table .rowlabel.row-group { font-weight: 700; }
  table.sheet-table .sheet-cell--value.row-group-subtotal { font-weight: 700; }
  .row-group-toggle {
    display: inline-block;
    width: 0.9em;
    cursor: pointer;
    color: var(--text-muted);
    user-select: none;
  }
  .row-group-toggle:hover { color: var(--excel-green-dark); }

  table.sheet-table .sheet-rownum, table.sheet-table .sheet-corner {
    min-width: 0;
    width: 1%;
  }

  /* Spaltenbuchstaben und Zeilennummern wie in Excel 365: hellgrau, Segoe UI,
     aktive Spalte/Zeile dunkler mit grüner Kante (siehe highlightActiveHeaders()) */
  table.sheet-table .sheet-colheads th,
  table.sheet-table .sheet-rownum {
    position: sticky;
    background: #F5F5F5;
    border-right-color: #D4D4D4;
    border-bottom-color: #D4D4D4;
    color: #444;
    font-family: var(--font-excel-ui);
    font-size: 12.5px;
    font-weight: 400;
    text-align: center;
    z-index: 2;
  }
  table.sheet-table .sheet-colheads th { top: 0; }
  table.sheet-table .sheet-rownum { left: 0; }

  table.sheet-table .sheet-colheads th.is-active {
    background: #E1E1E1;
    color: #0E6B37;
    box-shadow: inset 0 -2px 0 var(--excel-green);
  }
  table.sheet-table .sheet-rownum.is-active {
    background: #E1E1E1;
    color: #0E6B37;
    box-shadow: inset -2px 0 0 var(--excel-green);
  }

  table.sheet-table .sheet-corner {
    position: sticky;
    left: 0;
    z-index: 3;
    background: #F5F5F5;
  }

  /* Das kleine graue Dreieck in der linken oberen Ecke ("Alles auswählen") */
  table.sheet-table .sheet-corner::after {
    content: "";
    position: absolute;
    right: 3px;
    bottom: 3px;
    border-style: solid;
    border-width: 0 0 8px 8px;
    border-color: transparent transparent #BDBDBD transparent;
  }

  /* Fixiert eine inhaltliche Kopfzeile (Feldnamen bzw. Pivot-Header) beim
     Scrollen — bewusst NUR Positionierung, kein Hintergrund/Schrift: eine
     Zeile kann Zellen aus Quelldaten UND Pivot-Bereich enthalten, und nur
     die tatsächlichen <th>-Kopfzellen (siehe oben) sollen grau erscheinen,
     nicht z. B. eine Quelldaten-Datenzeile, die zufällig dieselbe Zeile teilt. */
  table.sheet-table .sheet-header-row th,
  table.sheet-table .sheet-header-row td {
    position: sticky;
    z-index: 1;
  }
  table.sheet-table .sheet-header-row .sheet-rownum { z-index: 3; }

  /* Der Filter-Bereich teilt sich seine Arbeitsblatt-Zeile mit der fixierten
     Quelldaten-Kopfzeile (Spalten A–C) und würde die Fixierung sonst einfach
     mit-erben — hier gezielt wieder aufheben, damit nur die Zellen A–C oben
     bleiben und der Filter-Bereich beim Scrollen normal mit wegläuft. */
  table.sheet-table th.filter-cell,
  table.sheet-table td.filter-cell {
    position: static;
  }

  table.sheet-table .cell-total {
    font-weight: 700;
    background: var(--excel-blue-tint);
  }

  /* Kopfzeile(n) der Pivot-Ausgabe selbst (Zeilen-/Spaltenbeschriftung,
     "Agg von Feld") — pro Zelle statt pro Zeile markiert, da die Zeile über
     den Merge auch die Quelldaten-Spalten A–D enthält, die ihr neutrales
     Grau behalten sollen, nicht das Blau der Pivot-Kopfzeile. */
  table.sheet-table th.pivot-header-row,
  table.sheet-table td.pivot-header-row {
    background: var(--excel-blue-tint);
  }

  /* Wertefeld-Kopfzelle mit "Werte anzeigen als"-Zusatz (z.B. "Summe von
     Umsatz (% vom übergeordneten Zeilenergebnis)") — als volle nowrap-Zeile
     würde das die Spalte weit über 300px aufblähen und mit Nachbarspalten
     kollidieren. table-layout:auto ignoriert dafür ein bloßes width/
     max-width aber gern zugunsten der (kurzen) Werte darunter — deshalb hier
     stattdessen hart abschneiden (Ellipsis) und den vollen Text nur per
     Tooltip (title-Attribut, siehe headerRow2-Aufbau) verfügbar machen; das
     garantiert unabhängig vom Tabellenlayout-Algorithmus, dass der Text nie
     in Nachbarspalten hineinragt. */
  table.sheet-table th.pivot-vf-header {
    width: 130px;
    max-width: 130px;
    overflow: hidden;
    text-overflow: ellipsis;
    cursor: default;
  }

  /* Lückenspalte bleibt immer weiß — auch innerhalb einer grauen Kopf-/
     Filterzeile, die sonst über die Zeilen-Klasse jede Zelle einfärben würde. */
  table.sheet-table th.sheet-gap,
  table.sheet-table td.sheet-gap {
    background: #fff;
  }

  /* ---------- Rechts angedockte PivotTable-Feldliste (echtes Excel-Panel-Vorbild) ---------- */
  /* Aufgabenbereich „PivotTable-Felder“ wie in Excel 365: Kopf mit ˅/×, Zahnrad,
     Suchfeld, Feldliste mit Kontrollkästchen, darunter die vier Bereiche als 2×2-
     Raster. Die Emojis als Feldsymbole bleiben bewusst (Florians Wunsch). */
  .pivot-fields-panel {
    width: 320px;
    flex-shrink: 0;
    /* Auf die volle Arbeitsblatt-Höhe strecken wie in Excel — den freien Platz
       unten nutzen die vier Bereiche (siehe .pivot-fields-panel__areas). */
    align-self: stretch;
    background: #fff;
    border-left: 1px solid #D4D4D4;
    padding: 10px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* Obergrenze für viele/lange Feld-Kästchen — gleich hoch wie .sheet-wrap */
    max-height: 560px;
    overflow-y: auto;
    font-family: var(--font-excel-ui);
    font-size: 13px;
    color: #262626;
  }

  /* Reicht die Höhe nicht, soll das Panel scrollen — nicht der Feldkasten zusammengedrückt werden */
  .pivot-fields-panel > * { flex-shrink: 0; }

  .pf-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .pivot-fields-panel__title {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: #1F1F1F;
  }

  .pf-header__icons {
    display: flex;
    gap: 10px;
    color: #424242;
  }

  .pf-subhead {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
  }

  .pf-gear {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    height: 26px;
    padding: 0 5px;
    border: 1px solid #C8C8C8;
    border-radius: 3px;
    color: #424242;
    flex-shrink: 0;
  }

  .pf-search {
    position: relative;
  }

  .pf-search input {
    width: 100%;
    box-sizing: border-box;
    height: 28px;
    padding: 0 30px 0 8px;
    border: 1px solid #C8C8C8;
    border-radius: 3px;
    font: inherit;
    color: #262626;
    outline: none;
  }

  .pf-search input:focus { border-color: var(--excel-green); }

  .pf-search svg {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    color: #424242;
    pointer-events: none;
  }

  /* "Dem Datenmodell hinzufügen" — schaltet "Diskrete Anzahl" frei, genau wie
     in echtem Excel (dort eine Option beim Erstellen der PivotTable). */
  .data-model-toggle {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 12.5px;
    color: #262626;
    cursor: pointer;
    padding: 0.1rem 0;
  }
  .data-model-toggle input { margin: 0; }

  /* ---------- Menüband-Nachbau (nur "PivotTable-Analyse" ist funktional —
     "Pivot"/"Entwurf" sind wie in echtem Excel weitere Reiter, hier aber rein
     dekorativ) ---------- */
  .excel-ribbon {
    background: var(--header-gray);
    border-bottom: 1px solid var(--grid-gray);
    font-family: var(--font-body);
    position: relative;
  }
  .excel-ribbon__tabs {
    display: flex;
    gap: 1.1rem;
    padding: 0.4rem 0.9rem 0;
    font-size: 0.78rem;
    color: var(--text-muted);
  }
  .excel-ribbon__tab { padding-bottom: 0.35rem; }
  .excel-ribbon__tab--active {
    color: var(--text-primary);
    font-weight: 700;
    border-bottom: 2px solid var(--excel-green);
  }
  .excel-ribbon__row {
    display: flex;
    align-items: stretch;
    padding: 0.3rem 0.9rem 0.35rem;
    background: #fff;
  }
  .excel-ribbon__group {
    display: flex;
    flex-direction: column;
    align-items: center;
    border-right: 1px solid var(--border-color);
    padding: 0 0.8rem 0 0;
  }
  .excel-ribbon__buttons { display: flex; gap: 0.3rem; }
  .excel-ribbon__btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.1rem;
    min-width: 4.4rem;
    background: none;
    border: 1px solid transparent;
    border-radius: 4px;
    padding: 0.3rem 0.4rem;
    font-family: var(--font-body);
    font-size: 0.68rem;
    color: var(--text-primary);
    cursor: pointer;
    line-height: 1.15;
  }
  .excel-ribbon__btn:not(:disabled):hover { background: var(--excel-green-tint); border-color: var(--excel-green); }
  .excel-ribbon__btn:disabled { color: var(--text-muted); cursor: default; opacity: 0.55; }
  .excel-ribbon__btn-icon { font-size: 1.15rem; }
  .excel-ribbon__btn-caret { font-size: 0.6rem; color: var(--text-muted); }
  .excel-ribbon__group-label {
    margin-top: 0.25rem;
    font-size: 0.68rem;
    color: var(--text-muted);
  }
  .excel-ribbon__menu {
    position: absolute;
    z-index: 7;
    top: 100%;
    left: 0.9rem;
    min-width: 220px;
    background: #fff;
    border: 1px solid var(--grid-gray);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    font-size: 0.8rem;
    color: var(--text-primary);
    padding: 0.25rem 0;
  }

  /* ---------- "Berechnetes Feld einfügen"-Dialog (Menüband → PivotTable-
     Analyse → Felder, Elemente und Gruppen → Berechnetes Feld …) ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 30, 22, 0.35);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
  }
  .calc-field-dialog {
    background: #fff;
    width: 420px;
    max-width: calc(100vw - 2rem);
    border-radius: 6px;
    box-shadow: 0 24px 60px rgba(11, 92, 48, 0.28);
    font-family: var(--font-body);
    color: var(--text-primary);
    overflow: hidden;
  }
  .calc-field-dialog__header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.6rem 0.9rem;
    background: var(--header-gray);
    border-bottom: 1px solid var(--grid-gray);
    font-weight: 700;
    font-size: 0.9rem;
  }
  .calc-field-dialog__close {
    background: none;
    border: none;
    font-size: 0.95rem;
    color: var(--text-muted);
    cursor: pointer;
    line-height: 1;
    padding: 0.1rem 0.3rem;
  }
  .calc-field-dialog__close:hover { color: var(--text-primary); }
  .calc-field-dialog__body { padding: 0.9rem; display: flex; flex-direction: column; gap: 0.6rem; }
  .calc-field-dialog__row { display: flex; align-items: center; gap: 0.5rem; }
  .calc-field-dialog__row label { width: 4rem; flex-shrink: 0; font-size: 0.82rem; }
  .calc-field-dialog__row input {
    flex: 1;
    min-width: 0;
    font-family: var(--font-mono);
    font-size: 0.82rem;
    border: 1px solid var(--grid-gray);
    border-radius: 3px;
    padding: 0.3rem 0.5rem;
  }
  .calc-field-dialog__error {
    background: var(--error-red-tint);
    color: var(--error-red);
    border: 1px solid var(--error-red);
    border-radius: 4px;
    padding: 0.4rem 0.6rem;
    font-size: 0.78rem;
  }
  .calc-field-dialog__fields-label { font-size: 0.82rem; }
  .calc-field-dialog__fields-list {
    border: 1px solid var(--grid-gray);
    border-radius: 3px;
    max-height: 160px;
    overflow-y: auto;
    font-size: 0.8rem;
  }
  .cf-field-item { padding: 0.28rem 0.6rem; cursor: pointer; }
  .cf-field-item:hover { background: var(--excel-green-tint); }
  .cf-field-item.selected { background: var(--excel-blue-tint); font-weight: 600; }
  .calc-field-dialog__insert-btn { align-self: flex-start; }
  .calc-field-dialog__footer {
    display: flex;
    justify-content: flex-end;
    gap: 0.5rem;
    padding: 0.7rem 0.9rem;
    background: var(--header-gray);
    border-top: 1px solid var(--grid-gray);
  }

  /* Feldliste in einem gerahmten Kasten wie in Excel, Kontrollkästchen = Feld liegt in einem Bereich */
  .pivot-fields-panel__list {
    display: flex;
    flex-direction: column;
    border: 1px solid #C8C8C8;
    min-height: 120px;
    max-height: 170px; /* 6 Felder (größtes Dataset) ohne Scrollen */
    overflow-y: auto;
    padding: 4px 0;
  }

  .field-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    font-size: 13px;
    cursor: grab;
    user-select: none;
  }
  .field-row > span:last-child { min-width: 0; overflow-wrap: break-word; }
  .field-row:active { cursor: grabbing; }
  .field-row:hover { background: #F0F0F0; }
  .field-row.selected { background: var(--excel-green-tint); box-shadow: inset 2px 0 0 var(--excel-green); }
  .field-row.is-used .field-name { font-weight: 700; } /* Excel hebt verwendete Felder fett hervor */
  .field-row .field-icon { font-size: 0.85rem; }

  .field-check {
    margin: 0;
    width: 14px;
    height: 14px;
    accent-color: var(--excel-green);
    cursor: pointer;
    flex-shrink: 0;
  }

  .pf-areas-caption {
    margin: 2px 0 0;
    padding-top: 8px;
    border-top: 1px dotted #C8C8C8;
    font-size: 12.5px;
  }

  /* Die vier Bereiche als 2×2-Raster wie in Excel: Filter | Spalten, Zeilen | Werte */
  .pivot-fields-panel__areas {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    /* auto statt 1fr: jede Zeile richtet sich nach ihrem Inhalt (sonst zöge eine
       leere Zeile mit, sobald z. B. Datum mit Stufen in Zeilen liegt); freier
       Platz wird trotzdem gleichmäßig auf beide Zeilen verteilt. */
    grid-template-rows: auto auto;
    flex: 1 0 auto; /* füllt die restliche Panel-Höhe bis zur Unterkante des Arbeitsblatts */
  }

  .area-box {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 6px 4px 4px;
  }
  .area-box:nth-child(odd) { border-right: 1px solid #D4D4D4; padding-left: 0; }
  .area-box:nth-child(even) { padding-right: 0; }
  .area-box:nth-child(n+3) { border-top: 1px solid #D4D4D4; }

  .area-box__label {
    display: flex;
    align-items: center;
    gap: 6px;
    margin: 0 2px 4px;
    font-size: 12.5px;
    color: #262626;
  }

  .area-box__label svg,
  .area-box__sigma {
    flex-shrink: 0;
    color: #616161;
  }

  .area-box__sigma {
    width: 14px;
    text-align: center;
    font-size: 14px;
    line-height: 1;
  }

  .area-box__drop {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 3px;
    flex: 1 0 auto; /* wächst mit der Bereichszeile */
    min-height: 70px;
    padding: 3px;
  }

  .pivot-fields-panel .zone-chip {
    padding: 2px 4px 2px 6px;
    font-size: 12.5px;
    max-width: 100%;
  }

  .chip {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--excel-green-tint);
    border: 1px solid var(--excel-green);
    color: var(--excel-green-dark);
    border-radius: 7px;
    padding: 0.32rem 0.55rem;
    font-size: 0.85rem;
    font-weight: 500;
    cursor: grab;
    user-select: none;
  }

  .chip:active { cursor: grabbing; }

  .chip.dragging { opacity: 0.4; }

  .chip.selected {
    outline: 2px solid var(--excel-green-dark);
    outline-offset: 1px;
  }

  .chip .field-icon { font-size: 0.9rem; }

  .zone-chip {
    background: #fff;
    border: 1px solid var(--excel-green);
    max-width: 100%;
    flex-wrap: wrap;
  }

  .zone-chip .chip-text {
    white-space: normal;
    word-break: break-word;
    min-width: 0;
  }

  .zone-chip button.chip-remove {
    border: none;
    background: none;
    color: var(--error-red);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 0 0.1rem;
    font-weight: 700;
  }

  /* Zweizeiliger Chip-Aufbau (Kopfzeile + eigene Zeile darunter für Datums-Stufen
     oder das Aggregations-Dropdown) — verhindert, dass ein select/Steuerelement
     neben einem Feldnamen um Platz konkurriert und seitlich abgeschnitten wird. */
  .zone-chip--multiline {
    display: flex; /* statt inline-flex: nimmt die volle Breite der Zone ein,
      damit width:100% beim Aggregations-Dropdown eindeutig berechnet werden kann */
    flex-direction: column;
    align-items: stretch;
    gap: 0.25rem;
  }

  .zone-chip__head {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    flex-wrap: wrap;
    min-width: 0;
  }

  .zone-chip--multiline .agg-select {
    width: 100%;
  }

  .dategroup-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 0.3rem;
  }

  .dategroup-pills .pill {
    font-family: var(--font-body);
    font-size: 0.72rem;
    font-weight: 500;
    background: #fff;
    color: var(--text-muted);
    border: 1px solid var(--grid-gray);
    border-radius: 999px;
    padding: 0.15rem 0.55rem;
    cursor: pointer;
  }

  .dategroup-pills .pill.active {
    background: var(--excel-green);
    border-color: var(--excel-green);
    color: #fff;
  }

  .calc-field-note {
    font-family: var(--font-body);
    font-size: 0.7rem;
    font-style: italic;
    color: var(--text-muted);
  }

  .zone-chip .agg-select {
    font-family: var(--font-body);
    font-size: 0.72rem;
    color: var(--text-primary);
    background: var(--header-gray);
    border: 1px solid var(--grid-gray);
    border-radius: 5px;
    padding: 0.1rem 0.3rem;
    cursor: pointer;
  }

  /* Pfeiltasten zum Verschieben eines Felds innerhalb derselben Zone (nur
     sichtbar, wenn dort mehr als ein Feld liegt). */
  .chip-reorder {
    border: none;
    background: none;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.65rem;
    line-height: 1;
    padding: 0.1rem 0.15rem;
    flex-shrink: 0;
  }
  .chip-reorder:hover { color: var(--excel-green-dark); }

  .dropzone {
    border: 1.5px dashed var(--grid-gray);
    border-radius: 8px;
    background: var(--header-gray);
    /* Größe kommt bewusst von .area-box__drop (kompakte Zonen) — diese Regel
       steht im Stylesheet danach und hätte sonst mit eigenem padding/
       min-height das kompakte Maß wieder überschrieben (Altlast aus einer
       früheren, größeren Zonen-Darstellung). */
    transition: background 0.15s, border-color 0.15s;
  }

  .dropzone .zone-label {
    font-size: 0.72rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: var(--text-muted);
    font-weight: 600;
    margin-bottom: 0.4rem;
    display: block;
  }

  .dropzone .zone-chips {
    display: flex;
    flex-direction: column;
    gap: 0.35rem;
  }

  .dropzone .zone-placeholder {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-style: italic;
  }

  .dropzone.dragover {
    background: var(--excel-green-tint);
    border-color: var(--excel-green);
  }

  .dropzone.selectable {
    cursor: pointer;
  }

  /* Excel-Optik innerhalb der Feldliste: weiße Ablageflächen ohne Platzhaltertext,
     Felder als schlichte weiße Kästchen statt grüner Pillen (Emoji bleibt). */
  .pivot-fields-panel .dropzone {
    border: 1px solid #E1E1E1;
    border-radius: 0;
    background: #fff;
  }
  .pivot-fields-panel .dropzone.dragover {
    background: var(--excel-green-tint);
    border-color: var(--excel-green);
  }
  .pivot-fields-panel .zone-placeholder { display: none; }
  .pivot-fields-panel .zone-chip {
    background: #fff;
    border: 1px solid #BDBDBD;
    border-radius: 2px;
    color: #262626;
    font-weight: 400;
  }
  .pivot-fields-panel .zone-chip:hover { border-color: #8A8A8A; }
  .pivot-fields-panel .chip.selected {
    outline: 2px solid var(--excel-green);
    outline-offset: -1px;
  }
  .pivot-fields-panel .zone-chip button.chip-remove {
    margin-left: auto;
    color: #8A8A8A;
    font-size: 15px;
    font-weight: 400;
  }
  .pivot-fields-panel .zone-chip button.chip-remove:hover { color: var(--error-red); }
  .pivot-fields-panel .zone-chip--multiline { gap: 3px; }
  .pivot-fields-panel .zone-chip .agg-select {
    font-family: var(--font-excel-ui);
    font-size: 12px;
    background: #fff;
    border: 1px solid #D1D1D1;
    border-radius: 2px;
  }

  /* ---------- Namenfeld + Bearbeitungsleiste (Excel 365, wie im Funktionen-Portal)
     + aktive Zelle (nur Pivot-Vorschau) ---------- */
  .formula-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 8px;
    background: #fff;
    border-bottom: 1px solid #E1E1E1;
    font-family: var(--font-excel-ui);
    font-size: 13px;
    color: #262626;
  }

  .formula-namebox,
  .formula-functions,
  .formula-field {
    display: flex;
    align-items: center;
    height: 26px;
    border: 1px solid #D1D1D1;
    border-radius: 4px;
    background: #fff;
  }

  .formula-namebox {
    flex: 0 0 auto;
    justify-content: space-between;
    gap: 6px;
    width: 104px;
    padding: 0 6px 0 8px;
  }

  .formula-namebox__ref {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .formula-namebox svg,
  .formula-fx svg {
    flex: 0 0 auto;
    color: #616161;
  }

  .formula-grip {
    display: flex;
    align-items: center;
    color: #8A8A8A;
  }

  .formula-functions {
    flex: 0 0 auto;
    gap: 2px;
    padding: 0 3px;
  }

  /* ✕ und ✓ ausgegraut wie in Excel, solange keine Eingabe läuft */
  .formula-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 20px;

  }

  .formula-fx {
    display: inline-flex;
    align-items: center;

    padding: 0 4px 0 5px;

  .formula-fx i {

  .sheet-cell--value { cursor: pointer; }

  .sheet-cell--active {

  .sheet-cell--active::after {

  button.btn-primary:hover { background: var(--excel-green-dark); }

  button.btn-secondary {
    background: #fff;
    color: var(--excel-green-dark);
  }
  button.btn-secondary:hover { background: var(--excel-green-tint); }

  #feedback {

    font-weight: 500;
    padding: 0.7rem 0.9rem;

  }
  #feedback.show { display: block; }
  #feedback.correct { background: var(--success-green-tint); color: var(--success-green); border: 1px solid var(--success-green); }
  #feedback.incorrect { background: var(--error-red-tint); color: var(--error-red); border: 1px solid var(--error-red); }
  #feedback ul { margin: 0.2rem 0 0; padding-left: 1.1rem; }

  /* ---------- Erfolgs-Popup bei richtiger Lösung (1:1 aus dem Übungsportal
     übernommen, gleiche Optik/Animation) ---------- */
  .success-popup-overlay {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(15, 30, 22, 0.4);
    border-radius: var(--radius);
    z-index: 9999;
    cursor: pointer;
    animation: success-fade-in 0.2s ease-out;
  }
  .success-popup {
    position: relative;
    background: var(--surface);
    border-radius: 18px;
    padding: 2.1rem 2.5rem 2rem;
    text-align: center;
    max-width: 320px;
    box-shadow: 0 24px 60px rgba(11, 92, 48, 0.28);
    cursor: default;
    animation: success-pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .success-popup__check-circle {
    stroke: var(--excel-green);
    stroke-width: 3;
    stroke-dasharray: 152;
    stroke-dashoffset: 152;
    animation: success-draw-circle 0.5s ease-out forwards;
  }
  .success-popup__check-mark {
    stroke: var(--excel-green);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 40;
    stroke-dashoffset: 40;
    animation: success-draw-check 0.35s 0.45s ease-out forwards;
  }
  .success-popup__title {
    font-family: var(--font-heading);
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0.9rem 0 0.3rem;
    color: var(--text-primary);
  }
  .success-popup__subtitle {
    margin: 0;
    color: var(--text-muted);
    font-size: 0.9rem;
  }
  .success-popup__confetti {
    position: absolute;
    left: 50%;
    top: 38%;
    width: 8px;
    height: 8px;
    border-radius: 2px;
    opacity: 0;
    animation: success-confetti 0.9s ease-out forwards;
  }
  @keyframes success-fade-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes success-pop-in {
    0% { transform: scale(0.6); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  @keyframes success-draw-circle {
    to { stroke-dashoffset: 0; }
  }
  @keyframes success-draw-check {
    to { stroke-dashoffset: 0; }
  }
  @keyframes success-confetti {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% { transform: translate(var(--dx), var(--dy)) rotate(var(--rot)); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .success-popup-overlay,
    .success-popup,
    .success-popup__check-circle,
    .success-popup__check-mark,
    .success-popup__confetti,
    .error-popup-overlay,
    .error-popup,
    .error-popup__icon-circle,
    .error-popup__icon-cross {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }

  /* ---------- Fehler-Popup bei falscher Lösung — gleiche Mechanik/Animation
     wie das Erfolgs-Popup oben (dieselben Keyframes wiederverwendet), nur in
     Rot mit einem Kreuz statt Häkchen und ohne Konfetti; schließt sich per
     Klick statt automatisch, da der Text hier tatsächlich gelesen werden
     soll. ---------- */
  .error-popup-overlay {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(40, 15, 15, 0.4);
    border-radius: var(--radius);
    z-index: 9999;
    cursor: pointer;
    animation: success-fade-in 0.2s ease-out;
  }
  .error-popup {
    position: relative;
    background: var(--surface);
    border-radius: 18px;
    padding: 2.1rem 2.5rem 2rem;
    text-align: center;
    max-width: 360px;
    box-shadow: 0 24px 60px rgba(146, 32, 32, 0.24);
    cursor: default;
    animation: success-pop-in 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .error-popup__icon-circle {
    stroke: var(--error-red);
    stroke-width: 3;
    stroke-dasharray: 152;
    stroke-dashoffset: 152;
    animation: success-draw-circle 0.5s ease-out forwards;
  }
  .error-popup__icon-cross {
    stroke: var(--error-red);
    stroke-width: 4;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 52;
    stroke-dashoffset: 52;
    animation: success-draw-check 0.35s 0.45s ease-out forwards;
  }
  .error-popup__title {
    font-family: var(--font-heading);
    font-size: 1.3rem;
    font-weight: 600;
    margin: 0.9rem 0 0.3rem;
    color: var(--text-primary);

    font-size: 0.9rem;
    text-align: left;
  }
  .error-popup__subtitle ul { margin: 0.3rem 0 0; padding-left: 1.2rem; }
</style>

<script>
window.starteExcelFloPivot = function (AUFGABE) {
  "use strict";

  // ---------- Meldungen an die Übungsseite (kostenlose Übungen) ----------
  // Kein eigenes Tracking: Die einbettende Seite entscheidet, was sie davon erfasst.
  var trackStats = { openedAt: Date.now(), attempts: 0 };
  function melde(typ, daten) {
    if (window.parent === window) return;
    try {
      window.parent.postMessage({ quelle: "excelflo-pivot", typ: typ, daten: daten || {} }, location.origin);
    } catch (e) {}
  }
  function trackEvent(event, detail) {
    melde("ereignis", { event: event, detail: detail || {} });
  }

  // ---------- Datengenerierung (seeded, damit die Demo stabil bleibt) ----------
  function mulberry32(seed) {
    return function () {
      seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
      var t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function formatDate(d) {
    var dd = String(d.getUTCDate()).padStart(2, "0");
    var mm = String(d.getUTCMonth() + 1).padStart(2, "0");
    return dd + "." + mm + "." + d.getUTCFullYear();
  }

  function formatCurrency(n) {
    return n.toLocaleString("de-DE", { maximumFractionDigits: 0 }) + " €";
  }
  function formatNumber(n) {
    return n.toLocaleString("de-DE", { maximumFractionDigits: 2 });
  }

  // ---------- Arbeitsblatt-Chrome (Spaltenbuchstaben, Zeilennummern, Gitter) ----------
  // Baut aus "logischen Zeilen" (Arrays von Zell-Deskriptoren {html, colspan,
  // header, cls, attrs}) eine Tabelle im Look eines rohen, unformatierten
  // Excel-Arbeitsblatts: Spaltenbuchstaben oben, Zeilennummern links,
  // durchgehende Gitternetzlinien. Zeilen mit row.sticky=true (die
  // inhaltlichen Kopfzeilen der jeweiligen Tabelle) bleiben beim Scrollen
  // zusammen mit der Buchstaben-Zeile oben fixiert. Wird sowohl für die
  // Quelldaten- als auch die Pivot-Vorschau-Tabelle verwendet.
  function columnLetter(n) {
    var s = "";
    while (n > 0) {
      var rem = (n - 1) % 26;
      s = String.fromCharCode(65 + rem) + s;
      n = Math.floor((n - 1) / 26);
    }
    return s;
  }

  function renderSheetTable(rows, extraTableClass) {
    var totalCols = 0;
    rows.forEach(function (row) {
      var cols = row.reduce(function (sum, cell) { return sum + (cell.colspan || 1); }, 0);
      if (cols > totalCols) totalCols = cols;
    });

    var ROW_H = 28; // px, angenommene Zeilenhöhe zum Stapeln fixierter Kopfzeilen
    var stickyDepth = 1; // Slot 0 ist die Spaltenbuchstaben-Zeile selbst

    var html = '<table class="sheet-table' + (extraTableClass ? " " + extraTableClass : "") + '"><thead><tr class="sheet-colheads"><th class="sheet-corner" style="top:0px;left:0px"></th>';
    for (var c = 1; c <= totalCols; c++) html += "<th>" + columnLetter(c) + "</th>";
    html += "</tr></thead><tbody>";

    rows.forEach(function (row, i) {
      var topStyle = "";
      if (row.sticky) {
        topStyle = ' style="top:' + (stickyDepth * ROW_H) + 'px"';
        stickyDepth++;
      }
      var trClasses = [];
      if (row.sticky) trClasses.push("sheet-header-row");
      if (row.cls) trClasses.push(row.cls);
      html += "<tr" + (trClasses.length ? ' class="' + trClasses.join(" ") + '"' : "") + '><th class="sheet-rownum"' + topStyle + ">" + (i + 1) + "</th>";
      row.forEach(function (cell) {
        var tag = cell.header ? "th" : "td";
        var cls = cell.cls ? ' class="' + cell.cls + '"' : "";
        var colspan = cell.colspan && cell.colspan > 1 ? ' colspan="' + cell.colspan + '"' : "";
        html += "<" + tag + cls + colspan + (cell.attrs || "") + topStyle + ">" + cell.html + "</" + tag + ">";
      });
      html += "</tr>";
    });

    html += "</tbody></table>";
    return html;
  }

  // ---------- Quelldaten als eigenständige Zeilen aufbereiten ----------
  // Jede Übung kann ihre eigene Beispieltabelle mitbringen (siehe
  // EXERCISES[].dataset weiter unten) — DATA/FIELDS/SOURCE_COL_COUNT/
  // sourceRows sind deshalb mutable und werden von loadDataset() befüllt,
  // nicht mehr einmalig fest verdrahtet.
  var DATA, FIELDS, SOURCE_COL_COUNT, sourceRows;

  // Baut die Quelldaten-Zeilen (inkl. Kopfzeile) generisch aus dataset.columns
  // + dataset.fields + dataset.rows auf — funktioniert für jede Spaltenzahl/
  // -reihenfolge, nicht nur für Datum/Region/Umsatz.
  function buildSourceRows(dataset) {
    function cellFor(col, html) {
      var cell = { html: html };
      if (!isNumericType(dataset.fields[col].type)) cell.cls = "rowlabel";
      return cell;
    }
    var headerRow = dataset.columns.map(function (col) {
      var cell = cellFor(col, col);
      cell.header = true;
      return cell;
    });
    // Fixiert (sticky): die Datenquelle-Box zeigt nur noch ca. 8 Zeilen auf
    // einmal (siehe .sheet-wrap--capped) — beim Scrollen durch ggf. 700+
    // Zeilen soll die Spaltenüberschrift oben sichtbar bleiben.
    headerRow.sticky = true;
    var rows = [headerRow];
    dataset.rows.forEach(function (row) {
      rows.push(dataset.columns.map(function (col) {
        return cellFor(col, filterFieldLabel(col, row[col]));
      }));
    });
    return rows;
  }

  // Rendert die (unveränderte) Quelldaten-Tabelle in die einklappbare
  // Datenquelle-Box — einmal pro Datensatzwechsel, nicht bei jedem
  // renderPivot(), da sich die Quelldaten innerhalb einer Übung nie ändern.
  function renderSourceDataTable() {
    document.getElementById("source-canvas").innerHTML = renderSheetTable(sourceRows);
    document.getElementById("source-caption").textContent =
      "Spalten A–" + columnLetter(SOURCE_COL_COUNT) + " · " + DATA.length + " Zeilen";
  }

  // Wechselt die komplette Datengrundlage (Quelldaten-Tabelle + Feldliste)
  // auf ein anderes Dataset — aufgerufen beim Start und jedes Mal, wenn eine
  // Übung mit einer anderen Beispieltabelle geöffnet wird.
  function loadDataset(name) {
    var dataset = DATASETS[name]();
    DATA = dataset.rows;
    FIELDS = dataset.fields;
    SOURCE_COL_COUNT = dataset.columns.length;
    sourceRows = buildSourceRows(dataset);
    renderSourceDataTable();
  }

  // ---------- Beispieltabelle der Aufgabe (Bauplan aus daten/aufgaben.json) ----------
  var DATASETS = {
    aufgabe: function () { return window.ExcelFloPivotDatensatz.erzeugeDatensatz(AUFGABE.datensatz); }
  };

  var AGGS_NUMERIC = ["Summe", "Anzahl", "Mittelwert", "Min", "Max"];
  var AGGS_OTHER = ["Anzahl"];

  // ---------- Datumsgruppierung ----------
  var DATE_LEVELS = ["jahr", "quartal", "monat", "tag"];
  var DATE_LEVEL_LABELS = { jahr: "Jahr", quartal: "Quartal", monat: "Monat", tag: "Tag" };
  var MONTH_NAMES = ["Januar", "Februar", "März", "April", "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"];
  // Bei einem vollen Jahr an Tagesdaten ist "Monat" ein sinnvollerer Default als
  // "Tag" (365 Einzeltage wären unübersichtlich) — echtes Excel schlägt beim
  // Gruppieren eines Datumsfelds ähnlich vor.
  var DEFAULT_DATE_LEVELS = ["monat"];
  // Aktuell gewählte Gruppierungsstufen je Datumsfeld (nur relevant, wenn das
  // Feld in Zeilen/Spalten liegt); fehlt ein Eintrag, gilt DEFAULT_DATE_LEVELS.
  var dateGroupLevels = {};

  // "percent" (z.B. ein Rabatt-%-Feld) rechnet sich genauso wie "number" —
  // nur die Anzeige unterscheidet sich (% statt €, siehe formatAggResult).
  function isNumericType(type) {
    return type === "number" || type === "percent";
  }

  // "Dem Datenmodell hinzufügen" — echtes Excel schaltet "Diskrete Anzahl"
  // (Distinct Count) nur frei, wenn die PivotTable auf dem Datenmodell
  // (PowerPivot) statt auf einem klassischen Bereich basiert. Nachgebildet
  // als globaler Schalter (siehe UI in renderFieldList()); pro Übung
  // zurückgesetzt wie die anderen übungsspezifischen Zustände.
  var addedToDataModel = false;

  function aggOptionsFor(fieldName) {
    var base = isNumericType(FIELDS[fieldName].type) ? AGGS_NUMERIC : AGGS_OTHER;
    return addedToDataModel ? base.concat(["Diskrete Anzahl"]) : base;
  }

  function defaultAgg(fieldName) {
    // Bewusst "Summe" als Default auch für %-Felder (nicht "Mittelwert") —
    // das Summieren von Prozentwerten ergibt inhaltlich keinen Sinn, genau
    // das soll die Übung "Aggregationsfunktion ändern" sichtbar machen.
    return isNumericType(FIELDS[fieldName].type) ? "Summe" : "Anzahl";
  }

  function aggregate(agg, values) {
    if (agg === "Anzahl") return values.length;
    // "Diskrete Anzahl" (Distinct Count) zählt jeden Wert nur einmal — nur
    // verfügbar, wenn "Dem Datenmodell hinzufügen" aktiviert ist (siehe
    // addedToDataModel), genau wie in echtem Excel nur mit PowerPivot/dem
    // Datenmodell möglich.
    if (agg === "Diskrete Anzahl") return new Set(values).size;
    var nums = values.map(Number);
    if (agg === "Summe") return nums.reduce(function (a, b) { return a + b; }, 0);
    if (agg === "Mittelwert") return nums.length ? nums.reduce(function (a, b) { return a + b; }, 0) / nums.length : 0;
    if (agg === "Min") return nums.length ? Math.min.apply(null, nums) : 0;
    if (agg === "Max") return nums.length ? Math.max.apply(null, nums) : 0;
    return 0;
  }

  // Berechnete Felder (Menüband → PivotTable-Analyse → "Felder, Elemente und
  // Gruppen" → "Berechnetes Feld …", z.B. Deckungsbeitragsmarge =
  // Deckungsbeitrag / Umsatz): existieren nicht als echte Spalte in den
  // Rohdaten. Excel berechnet sie, indem es jedes in der Formel verwendete
  // Basisfeld zuerst jeweils SUMMIERT und danach erst die Formel auf diese
  // Summen anwendet — genau das ist der Grund, warum man eine Marge nicht
  // als normales Wertfeld mitteln/summieren darf: das würde jede Zeile
  // einzeln (statt die Summen) verrechnen.
  //
  // Die Formel selbst ist ein frei getippter Ausdruck (Feldnamen, Zahlen,
  // + - * /, Klammern) — dafür ein kleiner Tokenizer/Parser/Auswerter statt
  // des früheren starren "Feld A [Operator] Feld B".
  var calculatedFields = {}; // name -> { formula: <Originaltext>, ast: <Baum>, fieldsUsed: [...] }

  function tokenizeFormula(str, fieldNames) {
    // Längste Feldnamen zuerst prüfen, damit z.B. "Einzelpreis" nicht schon
    // an einem kürzeren, zufällig als Präfix passenden Feldnamen abbricht.
    var sorted = fieldNames.slice().sort(function (a, b) { return b.length - a.length; });
    var tokens = [];
    var i = 0;
    while (i < str.length) {
      var ch = str.charAt(i);
      if (/\s/.test(ch)) { i++; continue; }
      if ("+-*/()".indexOf(ch) !== -1) { tokens.push({ type: "op", value: ch }); i++; continue; }
      if (/[0-9]/.test(ch)) {
        var j = i;
        while (j < str.length && /[0-9.]/.test(str.charAt(j))) j++;
        var num = parseFloat(str.slice(i, j));
        if (isNaN(num)) throw new Error('Ungültige Zahl: "' + str.slice(i, j) + '".');
        tokens.push({ type: "num", value: num });
        i = j; continue;
      }
      var matched = null;
      for (var k = 0; k < sorted.length; k++) {
        if (str.substr(i, sorted[k].length) === sorted[k]) { matched = sorted[k]; break; }
      }
      if (matched) { tokens.push({ type: "field", value: matched }); i += matched.length; continue; }
      throw new Error('Unbekanntes Zeichen oder Feld an Position ' + (i + 1) + ': "' + ch + '".');
    }
    return tokens;
  }

  // Rekursiver Abstiegs-Parser mit klassischer Operatorpriorität
  // (*, / vor +, -) und Klammern — baut einen kleinen Ausdrucksbaum.
  function parseFormulaTokens(tokens) {
    var pos = 0;
    function peek() { return tokens[pos]; }
    function next() { return tokens[pos++]; }
    function parseExpr() {
      var node = parseTerm();
      while (peek() && peek().type === "op" && (peek().value === "+" || peek().value === "-")) {
        var op = next().value;
        node = { type: "binop", op: op, left: node, right: parseTerm() };
      }
      return node;
    }
    function parseTerm() {
      var node = parseFactor();
      while (peek() && peek().type === "op" && (peek().value === "*" || peek().value === "/")) {
        var op = next().value;
        node = { type: "binop", op: op, left: node, right: parseFactor() };
      }
      return node;
    }
    function parseFactor() {
      var t = peek();
      if (!t) throw new Error("Die Formel ist unvollständig.");
      if (t.type === "op" && t.value === "-") { next(); return { type: "neg", value: parseFactor() }; }
      if (t.type === "op" && t.value === "+") { next(); return parseFactor(); }
      if (t.type === "op" && t.value === "(") {
        next();
        var node = parseExpr();
        if (!peek() || peek().value !== ")") throw new Error("Schließende Klammer fehlt.");
        next();
        return node;
      }
      if (t.type === "num") { next(); return { type: "num", value: t.value }; }
      if (t.type === "field") { next(); return { type: "field", value: t.value }; }
      throw new Error("Unerwartetes Zeichen in der Formel.");
    }
    var result = parseExpr();
    if (pos < tokens.length) throw new Error("Unerwartete Zeichen am Ende der Formel.");
    return result;
  }

  function evalFormulaAst(node, sums) {
    if (node.type === "num") return node.value;
    if (node.type === "field") return sums[node.value] || 0;
    if (node.type === "neg") return -evalFormulaAst(node.value, sums);
    var l = evalFormulaAst(node.left, sums), r = evalFormulaAst(node.right, sums);
    if (node.op === "+") return l + r;
    if (node.op === "-") return l - r;
    if (node.op === "*") return l * r;
    return r ? l / r : 0; // "/"
  }

  // Kanonische Textform des Baums (voll geklammert, ohne Leerzeichen) — für
  // den Ergebnisvergleich beim Prüfen: so zählt "Deckungsbeitrag/Umsatz"
  // genauso wie "Deckungsbeitrag / Umsatz", unabhängig vom eigenen
  // Feldnamen, den der Schüler seinem berechneten Feld gegeben hat.
  function serializeFormulaAst(node) {
    if (node.type === "num") return String(node.value);
    if (node.type === "field") return node.value;
    if (node.type === "neg") return "-(" + serializeFormulaAst(node.value) + ")";
    return "(" + serializeFormulaAst(node.left) + node.op + serializeFormulaAst(node.right) + ")";
  }

  function collectFormulaFields(node, out) {
    if (node.type === "field") { if (out.indexOf(node.value) === -1) out.push(node.value); return; }
    if (node.type === "neg") { collectFormulaFields(node.value, out); return; }
    if (node.type === "binop") { collectFormulaFields(node.left, out); collectFormulaFields(node.right, out); }
  }

  // Parst eine vom Schüler getippte Formel (führendes "=" optional) gegen die
  // aktuell verfügbaren Basisfelder (keine bereits berechneten Felder — genau
  // wie in echtem Excel zeigt die "Felder"-Liste im Dialog nur Quellfelder).
  // Wirft bei jedem Fehler eine Error mit einer für Schüler verständlichen
  // deutschen Meldung.
  function parseCalcFormula(rawFormula) {
    var str = rawFormula.trim();
    if (str.charAt(0) === "=") str = str.slice(1).trim();
    if (!str) throw new Error("Die Formel ist leer.");
    var fieldNames = Object.keys(FIELDS).filter(function (f) { return !FIELDS[f].calculated; });
    var tokens = tokenizeFormula(str, fieldNames);
    if (!tokens.length) throw new Error("Die Formel ist leer.");
    var ast = parseFormulaTokens(tokens);
    var fieldsUsed = [];
    collectFormulaFields(ast, fieldsUsed);
    if (!fieldsUsed.length) throw new Error("Die Formel muss mindestens ein Feld enthalten.");
    return { ast: ast, fieldsUsed: fieldsUsed };
  }

  // Baut einen calculatedFields-Eintrag aus einer Formel (wirft bei
  // Formelfehlern) — von der Übungs-Initialisierung (verstecktes
  // Referenzfeld) und vom "Berechnetes Feld einfügen"-Dialog gleichermaßen
  // genutzt.
  function buildCalcFieldEntry(rawFormula) {
    var parsed = parseCalcFormula(rawFormula);
    return { formula: rawFormula, ast: parsed.ast, fieldsUsed: parsed.fieldsUsed };
  }

  function aggregateForValueField(vf, rows) {
    var cf = calculatedFields[vf.field];
    if (!cf) return aggregate(vf.agg, rows.map(function (d) { return d[vf.field]; }));
    var sums = {};
    cf.fieldsUsed.forEach(function (f) {
      sums[f] = aggregate("Summe", rows.map(function (d) { return d[f]; }));
    });
    return evalFormulaAst(cf.ast, sums);
  }

  function formatPercent(n) {
    return n.toLocaleString("de-DE", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " %";
  }

  // showAs: optionale "Werte anzeigen als"-Einstellung des Wertefelds
  // (z.B. "percentOfTotal") — überschreibt die sonst vom Feldtyp bestimmte
  // Darstellung, weil der Zahlenwert an dieser Stelle bereits ein
  // Prozentanteil ist, keine Währung/Anzahl mehr.
  var PERCENT_SHOWAS_MODES = { percentOfTotal: true, percentOfParentRow: true, percentDifferenceFrom: true };

  // Beschriftungszusatz für die Pivot-Kopfzeile, je nach "Werte anzeigen
  // als"-Modus des Wertefelds — bei den positionsbasierten Modi inkl. des
  // gewählten Basisfelds (immer "vorheriges Element" als Basiselement, siehe
  // buildRowDisplayList()s prevSiblingData/cumulativeData).
  function showAsLabelSuffix(vf) {
    if (vf.showAs === "percentOfTotal") return " (% vom Gesamtergebnis)";
    if (vf.showAs === "percentOfParentRow") return " (% vom übergeordneten Zeilenergebnis)";
    if (vf.showAs === "differenceFrom") return " (Differenz von " + (vf.showAsBase || "") + ")";
    if (vf.showAs === "percentDifferenceFrom") return " (% Differenz von " + (vf.showAsBase || "") + ")";
    if (vf.showAs === "runningTotal") return " (Laufende Summe in " + (vf.showAsBase || "") + ")";
    return "";
  }

  function formatAggResult(agg, fieldName, value, showAs) {
    // "Differenz von"/"Laufende Summe in" haben beim allerersten Element
    // (kein Vorgänger) bzw. in der Gesamtzeile keinen sinnvollen Wert —
    // bleibt leer, genau wie in echtem Excel.
    if (value === null || value === undefined) return "";
    if (PERCENT_SHOWAS_MODES[showAs]) return formatPercent(value);
    if (agg === "Anzahl" || agg === "Diskrete Anzahl") return formatNumber(value);
    // Berechnete Feld-Ergebnisse aus einer Division liegen als Verhältnis
    // (0,352) vor, nicht als fertiger Prozentwert (14) wie beim "percent"-
    // Feldtyp — deshalb hier zusätzlich ×100.
    if (FIELDS[fieldName].calculated && FIELDS[fieldName].type === "percent") return formatPercent(Math.round(value * 1000) / 10);
    if (FIELDS[fieldName].type === "percent") return formatPercent(Math.round(value * 10) / 10);
    if (FIELDS[fieldName].type === "number") return formatCurrency(Math.round(value * 100) / 100);
    return formatNumber(value);
  }

  // ---------- Übungs-Definitionen ----------
  // ---------- Die eine Aufgabe dieser Seite ----------
  // Aufgabentext, Tipps und Lösung zeigt die Übungsseite selbst; hier nur, was
  // die Pivot-Logik braucht (Prüfregel in solution, siehe checkSolution()).
  var currentExercise = {
    id: AUFGABE.id,
    dataset: "aufgabe",
    category: "",
    title: AUFGABE.title,
    intro: "",
    hints: [],
    solution: AUFGABE.loesungPruefung
  };

  // ---------- Zustand ----------
  // zones.rows / columns / filter: array of field names
  // zones.values: array of { field, agg }
  var zones = { filter: [], columns: [], rows: [], values: [] };
  var selectedField = null; // field name currently selected via click (mobile fallback)
  var selectedFieldZone = null; // null = ausgewählt aus der Feldliste; sonst die Zone, aus der ein bereits platziertes Feld zum Verschieben ausgewählt wurde
  var selectedEntryId = null; // bei Werte-Chips: welche konkrete Instanz ausgewählt ist (bei Duplikaten nötig)

  var fieldListEl = document.getElementById("field-list");
  var zoneEls = {
    filter: document.getElementById("zone-filter"),
    columns: document.getElementById("zone-columns"),
    rows: document.getElementById("zone-rows"),
    values: document.getElementById("zone-values")
  };

  function fieldInZone(zoneKey, fieldName) {
    if (zoneKey === "values") return zones.values.some(function (v) { return v.field === fieldName; });
    return zones[zoneKey].indexOf(fieldName) !== -1;
  }

  // Werte-Einträge werden über eine eindeutige ID identifiziert, nicht über
  // den Feldnamen — echtes Excel erlaubt, dasselbe Feld mehrfach in Werte
  // abzulegen (z.B. einmal normal, einmal als "Differenz von"), und dann
  // müssen Entfernen/Verschieben/Aggregation/"Werte anzeigen als" den
  // richtigen der beiden gleichnamigen Einträge treffen.
  var valueEntryIdSeq = 0;
  function findValueEntry(entryId) {
    return zones.values.find(function (v) { return v.id === entryId; });
  }

  // Reine Zustandsänderungen ohne Re-Render, damit ein Verschieben (Entfernen +
  // Hinzufügen) als ein einziger Render-Durchlauf passiert statt zwei.
  function addToZoneState(zoneKey, fieldName) {
    if (zoneKey === "values") {
      zones.values.push({ id: "v" + (++valueEntryIdSeq), field: fieldName, agg: defaultAgg(fieldName) });
    } else {
      if (fieldInZone(zoneKey, fieldName)) return;
      zones[zoneKey].push(fieldName);
    }
    // Ein zusätzliches/neues Zeilenfeld ändert den Kombi-Schlüsselraum —
    // alte Zeilenbeschriftungen-Filter-/Sortierauswahl passt dann nicht mehr.
    if (zoneKey === "rows") { rowLabelHidden = []; rowLabelSortDir = null; collapsedRowGroups = {}; valueFilter = null; }
  }

  // entryId: bei zoneKey "values" die konkrete zu entfernende Instanz (bei
  // mehreren gleichnamigen Feldern sonst mehrdeutig); bei anderen Zonen
  // ungenutzt, dort identifiziert der Feldname eindeutig.
  function removeFromZoneState(zoneKey, fieldName, entryId) {
    if (zoneKey === "values") {
      zones.values = zones.values.filter(function (v) { return entryId ? v.id !== entryId : v.field !== fieldName; });
    } else {
      zones[zoneKey] = zones[zoneKey].filter(function (f) { return f !== fieldName; });
    }
    // Ein Feld, das den Filter-Bereich verlässt, nimmt seine gewählte
    // Filterauswahl mit — sonst würde sie beim erneuten Ablegen "unsichtbar"
    // fortbestehen.
    if (zoneKey === "filter") delete filterSelections[fieldName];
    // Ändert sich die Zeilen-Zone, sind alte Zeilenbeschriftungen-Kombi-Keys
    // (Sortierung/ausgeblendete Werte) für das neue Feld-Set bedeutungslos.
    if (zoneKey === "rows") { rowLabelHidden = []; rowLabelSortDir = null; collapsedRowGroups = {}; valueFilter = null; }
  }

  function addFieldToZone(zoneKey, fieldName) {
    addToZoneState(zoneKey, fieldName);
    renderAll();
  }

  // Vertauscht ein Feld mit seinem Nachbarn innerhalb derselben Zone (direction
  // -1 = nach oben, +1 = nach unten) — z.B. um bei zwei Feldern in Zeilen
  // (Region + Land) festzulegen, welches außen/innen gruppiert wird.
  function moveFieldWithinZone(zoneKey, fieldName, direction, entryId) {
    var arr = zones[zoneKey];
    var idx = zoneKey === "values"
      ? arr.findIndex(function (v) { return v.id === entryId; })
      : arr.indexOf(fieldName);
    if (idx === -1) return;
    var newIdx = idx + direction;
    if (newIdx < 0 || newIdx >= arr.length) return;
    var tmp = arr[idx];
    arr[idx] = arr[newIdx];
    arr[newIdx] = tmp;
    renderAll();
  }

  function removeFieldFromZone(zoneKey, fieldName, entryId) {
    removeFromZoneState(zoneKey, fieldName, entryId);
    renderAll();
  }

  // Verschiebt ein bereits platziertes Feld von einer Zone in eine andere
  // (per Drag & Drop oder per Klick-Auswahl + Klick auf die Zielzone).
  // fromZone ist null, wenn das Feld frisch aus der Feldliste kommt.
  function moveFieldToZone(fieldName, fromZone, toZone, entryId) {
    if (fromZone === toZone) return;
    if (fromZone) removeFromZoneState(fromZone, fieldName, entryId);
    addToZoneState(toZone, fieldName);
    renderAll();
  }

  function setAgg(entryId, agg) {
    var entry = findValueEntry(entryId);
    if (!entry) return;
    entry.agg = agg;
    renderPivot();
  }

  // showAsBase: nur für die positionsbasierten Modi (Differenz von, %
  // Differenz von, Laufende Summe in) relevant — welches Feld als Basis für
  // "Vorgänger"/"kumuliert bis hier" dient (siehe buildRowDisplayList()).
  // Basiselement ist dabei immer "vorheriges" — ein Auswahl-UI dafür (wie in
  // echtem Excel möglich) ist hier bewusst nicht nachgebaut.
  function setShowAs(entryId, showAs, showAsBase) {
    var entry = findValueEntry(entryId);
    if (!entry) return;
    if (showAs) entry.showAs = showAs; else delete entry.showAs;
    if (showAsBase) entry.showAsBase = showAsBase; else delete entry.showAsBase;
    renderPivot();
  }

  // ---------- Rendering: Aufgabentext ----------
  function renderExerciseText() {
    // Aufgabentext steht auf der Übungsseite.
  }

  // ---------- Stufen-Tabs + Übungsauswahl je Stufe (wie im Übungsportal) ----------
  // Setzt allen übungsspezifischen Zustand zurück — geteilt zwischen dem
  // "Zurücksetzen"-Button und dem Wechsel zu einer anderen Übung/Stufe.
  function resetExerciseState() {
    zones = { filter: [], columns: [], rows: [], values: [] };
    dateGroupLevels = {};
    filterSelections = {};
    rowLabelHidden = [];
    rowLabelSortDir = null;
    collapsedRowGroups = {};
    valueFilter = null;
    valueFilterFormOpen = false;
    selectedField = null;
    selectedFieldZone = null;
    selectedEntryId = null;
    feedbackEl.classList.remove("show", "correct", "incorrect");
  }

  // Öffnet eine einzelne Übung im Vollbild — die Übersicht (Stufen-Tabs +
  // Kartenraster) verschwindet dabei komplett, genau wie beim Wechsel von der
  // Portal-Übersicht auf eine einzelne Übungsseite. Nur "← Alle Übungen"
  // bringt die Übersicht zurück.
  function openExercise(ex) {
    // Erst sichtbar machen, dann rendern: renderPivot() misst die reale
    // Breite von #sheet-canvas (Ankerspalten-Auffüllung, Leer-Overlay-
    // Positionierung) — bei display:none wäre das noch 0 und das Layout
    // bricht (Platzhalter-Grafik landet falsch positioniert).

    currentExercise = ex;
    loadDataset(ex.dataset || "sales");
    // Berechnete Felder und der Datenmodell-Schalter sind an das jeweilige
    // Dataset gebunden (loadDataset() ersetzt FIELDS ohnehin komplett) —
    // beim Wechsel der Übung zurücksetzen, beim bloßen "Zurücksetzen"
    // innerhalb derselben Übung aber bewusst erhalten (siehe resetExerciseState).
    calculatedFields = {};
    // Manche Übungen brauchen eine berechnete Referenz-Formel für die
    // Bewertung, OHNE dass der Name im Feld-Panel auftaucht (der Student
    // soll das Feld selbst über das Menüband anlegen, siehe openCalcFieldDialog()).
    (ex.referenceCalcFields || []).forEach(function (rf) {
      calculatedFields[rf.name] = buildCalcFieldEntry(rf.formula);
    });
    addedToDataModel = false;
    closeCalcFieldDialog();
    closeRibbonMenu();
    // Das Menüband gibt es in echtem Excel natürlich immer — hier zeigen wir
    // es aber bewusst nur in der Übung, die "Berechnetes Feld" tatsächlich
    // braucht, damit es in allen anderen Übungen nicht unnötig vom eigentlich
    // relevanten Bereich (Feldliste/Zonen) ablenkt.
    document.querySelector(".excel-ribbon").hidden = ex.category !== "berechnetesfeld";
    // "Dem Datenmodell hinzufügen" nur in der Übung zeigen, die "Diskrete
    // Anzahl" tatsächlich braucht — sonst lenkt die Option in jeder anderen
    // Übung nur unnötig ab (gleiches Prinzip wie beim Menüband oben).
    document.querySelector(".data-model-toggle").hidden = ex.category !== "datenmodell";
    document.getElementById("data-model-checkbox").checked = false;
    resetExerciseState();
    renderExerciseText();
    document.getElementById("field-search").value = ""; // Suche aus der vorigen Übung nicht mitnehmen
    renderFieldList();
    renderAll();

    trackStats = { openedAt: Date.now(), attempts: 0 };
    trackEvent("exercise_open");
  }

  // ---------- Rendering: Feldliste (Excel-Feldliste: Checkbox-artige Zeilen, kein Chip-Look) ----------

  // ---------- Menüband-Dropdown "Felder, Elemente und Gruppen" ----------
  function closeRibbonMenu() {
    var menu = document.getElementById("ribbon-fields-groups-menu");
    if (menu) menu.remove();
  }

  function openRibbonMenu() {
    if (document.getElementById("ribbon-fields-groups-menu")) { closeRibbonMenu(); return; }
    var group = document.getElementById("ribbon-fields-groups-btn").closest(".excel-ribbon");
    group.insertAdjacentHTML("beforeend",
      '<div class="excel-ribbon__menu" id="ribbon-fields-groups-menu">' +
        '<div class="rlm-item" data-action="open-calc-field-dialog">Berechnetes Feld …</div>' +
        '<div class="rlm-item rlm-item--disabled">Berechnetes Element …</div>' +
        '<div class="rlm-sep"></div>' +
        '<div class="rlm-item rlm-item--disabled">Reihenfolge lösen</div>' +
        '<div class="rlm-item rlm-item--disabled">Elemente auflisten</div>' +
      "</div>"
    );
    document.getElementById("ribbon-fields-groups-menu").addEventListener("click", function (e) {
      e.stopPropagation();
      var item = e.target.closest("[data-action]");
      if (!item) return;
      if (item.dataset.action === "open-calc-field-dialog") {
        closeRibbonMenu();
        openCalcFieldDialog();
      }
    });
  }

  // ---------- "Berechnetes Feld einfügen"-Dialog (Nachbau des echten Excel-
  // Dialogs unter Menüband → PivotTable-Analyse → Felder, Elemente und
  // Gruppen → Berechnetes Feld …) ----------
  var calcFieldNameCounter = 0;

  function closeCalcFieldDialog() {
    var overlay = document.getElementById("calc-field-modal");
    if (overlay) overlay.remove();
  }

  // Fügt "text" an der aktuellen Cursor-/Auswahlposition des Formel-Felds ein
  // (ersetzt eine evtl. Auswahl) — genau wie in echtem Excel beim Einfügen
  // eines Felds per Doppelklick oder "Feld einfügen".
  function insertIntoFormulaInput(text) {
    var input = document.getElementById("cf-formula-input");
    if (!input) return;
    input.focus();
    var start = input.selectionStart == null ? input.value.length : input.selectionStart;
    var end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
    if (typeof input.setRangeText === "function") {
      input.setRangeText(text, start, end, "end");
    } else {
      input.value = input.value.slice(0, start) + text + input.value.slice(end);
    }
  }

  function showCalcFieldError(message) {
    var el = document.getElementById("cf-error");
    if (!el) return;
    if (!message) { el.hidden = true; el.textContent = ""; return; }
    el.hidden = false;
    el.textContent = message;
  }

  // Trägt Name + Formel eines bereits bestehenden berechneten Felds zur
  // Bearbeitung in den Dialog ein — wie in echtem Excel, wenn man im
  // Namensfeld ein vorhandenes berechnetes Feld auswählt.
  function loadCalcFieldIntoDialog(name) {
    var cf = calculatedFields[name];
    if (!cf || !FIELDS[name]) return; // FIELDS[name] fehlt bei einem versteckten referenceCalcFields-Eintrag
    document.getElementById("cf-name-input").value = name;
    document.getElementById("cf-formula-input").value = cf.formula;
    showCalcFieldError(null);
  }

  function renderCalcFieldsList(selectedField) {
    var candidates = Object.keys(FIELDS).filter(function (f) { return !FIELDS[f].calculated; });
    return candidates.map(function (f) {
      var sel = f === selectedField ? " selected" : "";
      return '<div class="cf-field-item' + sel + '" data-field="' + escapeAttr(f) + '">' + escapeAttr(f) + "</div>";
    }).join("");
  }

  // Übernimmt Name + Formel aus dem Dialog als (neues oder bearbeitetes)
  // berechnetes Feld. Gibt true bei Erfolg zurück, sonst false (mit
  // angezeigter Fehlermeldung) — von "Hinzufügen" und "OK" gemeinsam genutzt.
  function submitCalcFieldDialog() {
    var name = document.getElementById("cf-name-input").value.trim();
    var formula = document.getElementById("cf-formula-input").value;
    if (!name) { showCalcFieldError("Bitte einen Namen für das Feld vergeben."); return false; }
    // Ein Name ist vergeben, wenn er eine normale Spalte/ein sichtbares Feld
    // trifft — ODER ein verstecktes referenceCalcFields-Referenzfeld einer
    // Übung (existiert in calculatedFields, aber bewusst nicht in FIELDS).
    var nameTaken = (FIELDS[name] && !FIELDS[name].calculated) || (calculatedFields[name] && !FIELDS[name]);

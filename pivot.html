    if (nameTaken) { showCalcFieldError('Der Name "' + name + '" ist bereits vergeben.'); return false; }
    var entry;
    try {
      entry = buildCalcFieldEntry(formula);
    } catch (err) {
      showCalcFieldError(err.message || "Die Formel konnte nicht gelesen werden.");
      return false;
    }
    calculatedFields[name] = entry;
    if (!FIELDS[name]) {
      var isRatio = entry.ast.type === "binop" && entry.ast.op === "/";
      FIELDS[name] = { icon: "🧮", type: isRatio ? "percent" : "number", calculated: true };
    }
    showCalcFieldError(null);
    renderFieldList();
    renderZones();
    renderPivot();
    return true;
  }

  function refreshCalcFieldNameList() {
    var list = document.getElementById("cf-name-list");
    if (!list) return;
    list.innerHTML = visibleCalcFieldNames().map(function (n) { return '<option value="' + escapeAttr(n) + '">'; }).join("");
  }

  function resetCalcFieldDialogForm() {
    calcFieldNameCounter++;
    var suggestedName = "Feld" + calcFieldNameCounter;
    while (FIELDS[suggestedName]) { calcFieldNameCounter++; suggestedName = "Feld" + calcFieldNameCounter; }
    var nameInput = document.getElementById("cf-name-input");
    var formulaInput = document.getElementById("cf-formula-input");
    nameInput.value = suggestedName;
    formulaInput.value = "= 0";
    // Cursor direkt auf die "0" setzen, damit ein sofort per Doppelklick
    // eingefügtes Feld sie ersetzt statt anzuhängen — genau wie in echtem
    // Excel beim frischen Öffnen des Dialogs.
    formulaInput.setSelectionRange(2, 3);
    showCalcFieldError(null);
    document.querySelectorAll("#cf-fields-list .cf-field-item.selected").forEach(function (el) { el.classList.remove("selected"); });
  }

  // Nur "echte", im Feld-Panel sichtbare berechnete Felder — ein
  // referenceCalcFields-Eintrag (verstecktes Referenzfeld einer Übung, siehe
  // openExercise()) darf hier nicht auftauchen, sonst würde die Musterlösung
  // über die Namensvorschläge verraten.
  function visibleCalcFieldNames() {
    return Object.keys(calculatedFields).filter(function (n) { return FIELDS[n] && FIELDS[n].calculated; });
  }

  function openCalcFieldDialog() {
    closeCalcFieldDialog();
    var existingNames = visibleCalcFieldNames();
    document.body.insertAdjacentHTML("beforeend",
      '<div class="modal-overlay" id="calc-field-modal">' +
        '<div class="calc-field-dialog" role="dialog" aria-label="Berechnetes Feld einfügen">' +
          '<div class="calc-field-dialog__header">' +
            "<span>Berechnetes Feld einfügen</span>" +
            '<button type="button" class="calc-field-dialog__close" data-action="cf-close" aria-label="Schließen">✕</button>' +
          "</div>" +
          '<div class="calc-field-dialog__body">' +
            '<div class="calc-field-dialog__row">' +
              "<label>Name:</label>" +
              '<input type="text" id="cf-name-input" list="cf-name-list">' +
              '<datalist id="cf-name-list">' + existingNames.map(function (n) { return '<option value="' + escapeAttr(n) + '">'; }).join("") + "</datalist>" +
              '<button type="button" class="rlm-btn rlm-btn--primary" data-action="cf-add">Hinzufügen</button>' +
            "</div>" +
            '<div class="calc-field-dialog__row">' +
              "<label>Formel:</label>" +
              '<input type="text" id="cf-formula-input">' +
              '<button type="button" class="rlm-btn" data-action="cf-delete">Löschen</button>' +
            "</div>" +
            '<div class="calc-field-dialog__error" id="cf-error" hidden></div>' +
            '<div class="calc-field-dialog__fields-label">Felder:</div>' +
            '<div class="calc-field-dialog__fields-list" id="cf-fields-list">' + renderCalcFieldsList(null) + "</div>" +
            '<button type="button" class="rlm-btn calc-field-dialog__insert-btn" data-action="cf-insert-field">Feld einfügen</button>' +
          "</div>" +
          '<div class="calc-field-dialog__footer">' +
            '<button type="button" class="btn btn-primary" data-action="cf-ok">OK</button>' +
            '<button type="button" class="btn btn-secondary" data-action="cf-close">Schließen</button>' +
          "</div>" +
        "</div>" +
      "</div>"
    );
    resetCalcFieldDialogForm();

    var overlay = document.getElementById("calc-field-modal");
    var nameInput = document.getElementById("cf-name-input");

    // Ein vorhandenes berechnetes Feld im Namensfeld auswählen lädt dessen
    // Formel zur Bearbeitung — wie in echtem Excel.
    nameInput.addEventListener("change", function () {
      if (calculatedFields[nameInput.value.trim()]) loadCalcFieldIntoDialog(nameInput.value.trim());
    });

    document.getElementById("cf-fields-list").addEventListener("click", function (e) {
      var item = e.target.closest(".cf-field-item");
      if (!item) return;
      document.querySelectorAll("#cf-fields-list .cf-field-item.selected").forEach(function (el) { el.classList.remove("selected"); });
      item.classList.add("selected");
    });
    document.getElementById("cf-fields-list").addEventListener("dblclick", function (e) {
      var item = e.target.closest(".cf-field-item");
      if (!item) return;
      insertIntoFormulaInput(item.dataset.field);
    });

    overlay.addEventListener("mousedown", function (e) {
      if (e.target === overlay) closeCalcFieldDialog();
    });
    overlay.addEventListener("click", function (e) {
      var action = e.target.closest("[data-action]");
      if (!action) return;
      if (action.dataset.action === "cf-close") { closeCalcFieldDialog(); return; }
      if (action.dataset.action === "cf-insert-field") {
        var sel = document.querySelector("#cf-fields-list .cf-field-item.selected");
        if (sel) insertIntoFormulaInput(sel.dataset.field);
        return;
      }
      if (action.dataset.action === "cf-add") {
        if (submitCalcFieldDialog()) { refreshCalcFieldNameList(); resetCalcFieldDialogForm(); }
        return;
      }
      if (action.dataset.action === "cf-delete") {
        var name = document.getElementById("cf-name-input").value.trim();
        if (!calculatedFields[name] || !FIELDS[name]) { showCalcFieldError('Kein berechnetes Feld mit dem Namen "' + name + '" vorhanden.'); return; }
        delete calculatedFields[name];
        delete FIELDS[name];
        // Bereits platzierte Werte-Einträge dieses Felds verlieren mit ihm
        // ihre Grundlage — wie in echtem Excel verschwinden sie aus der
        // Pivot-Tabelle.
        zones.values = zones.values.filter(function (v) { return v.field !== name; });
        renderFieldList();
        renderZones();
        renderPivot();
        refreshCalcFieldNameList();
        resetCalcFieldDialogForm();
        return;
      }
      if (action.dataset.action === "cf-ok") {
        if (submitCalcFieldDialog()) closeCalcFieldDialog();
      }
    });
  }

  // Suchfeld über der Feldliste (wie in Excel) — filtert nur die Anzeige.
  var fieldSearchEl = document.getElementById("field-search");
  fieldSearchEl.addEventListener("input", function () { renderFieldList(); });

  function fieldInAnyZone(name) {
    return ["filter", "columns", "rows", "values"].some(function (z) { return fieldInZone(z, name); });
  }

  // Kontrollkästchen wie in Excel: Anhaken legt das Feld in den Standardbereich
  // (Zahlen → Werte, sonst → Zeilen), Abhaken entfernt es aus allen Bereichen.
  function toggleFieldInReport(name) {
    if (fieldInAnyZone(name)) {
      ["filter", "columns", "rows", "values"].forEach(function (z) {
        if (fieldInZone(z, name)) removeFromZoneState(z, name); // bei "values" ohne entryId: alle Einträge des Felds
      });
    } else {
      addToZoneState(isNumericType(FIELDS[name].type) ? "values" : "rows", name);
    }
    selectedField = null;
    selectedFieldZone = null;
    selectedEntryId = null;
    renderFieldList();
    renderAll();
  }

  // Häkchen + Fettdruck an den aktuellen Zonen-Zustand angleichen (aus renderZones
  // aufgerufen, damit auch Drag & Drop und ×-Entfernen die Kontrollkästchen aktualisieren).
  function syncFieldChecks() {
    fieldListEl.querySelectorAll(".field-row").forEach(function (row) {
      var used = fieldInAnyZone(row.dataset.field);
      row.classList.toggle("is-used", used);
      var check = row.querySelector(".field-check");
      if (check) check.checked = used;
    });
  }

  function renderFieldList() {
    var query = fieldSearchEl ? fieldSearchEl.value.trim().toLowerCase() : "";
    var html = "";
    Object.keys(FIELDS).forEach(function (name) {
      // Nur markieren, wenn die Auswahl auch wirklich aus der Feldliste stammt —
      // ein zum Verschieben ausgewähltes Feld aus einer Zone zeigt seine
      // Markierung stattdessen dort (siehe renderZone).
      var sel = (selectedField === name && selectedFieldZone === null) ? " selected" : "";
      var hidden = query && name.toLowerCase().indexOf(query) === -1 ? " hidden" : "";
      html += '<div class="field-row' + sel + '" draggable="true" data-field="' + name + '"' + hidden + '>' +
        '<input type="checkbox" class="field-check" tabindex="-1" aria-label="' + escapeAttr(name) + ' in den Bericht aufnehmen">' +
        '<span class="field-icon">' + FIELDS[name].icon + '</span><span class="field-name">' + name + "</span></div>";
    });
    fieldListEl.innerHTML = html;
    syncFieldChecks();

    fieldListEl.querySelectorAll(".field-row").forEach(function (row) {
      row.querySelector(".field-check").addEventListener("click", function (e) {
        e.stopPropagation(); // keine Klick-Auswahl der Zeile auslösen
        toggleFieldInReport(row.dataset.field);
      });
      row.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", row.dataset.field);
        row.classList.add("dragging");
      });
      row.addEventListener("dragend", function () { row.classList.remove("dragging"); });
      row.addEventListener("click", function () {
        if (selectedField === row.dataset.field && selectedFieldZone === null) {
          selectedField = null;
        } else {
          selectedField = row.dataset.field;
          selectedFieldZone = null;
          selectedEntryId = null;
        }
        renderFieldList();
        renderZones(); // löscht ggf. die Markierung eines zuvor zum Verschieben ausgewählten Zonen-Chips
      });
    });
  }

  // ---------- Rendering: Drop-Zonen ----------
  function renderZone(zoneKey) {
    var el = zoneEls[zoneKey];
    var entries = zoneKey === "values" ? zones.values : zones[zoneKey].map(function (f) { return { field: f }; });

    if (entries.length === 0) {
      el.innerHTML = '<span class="zone-placeholder">Felder hierher ziehen</span>';
      return;
    }

    var showDateGroups = zoneKey === "rows" || zoneKey === "columns";

    var html = "";
    entries.forEach(function (entry, entryIdx) {
      var fieldName = entry.field;
      var aggControl = "";
      if (zoneKey === "values") {
        // Nur die Berechnungsart (Summe/Anzahl/…) steht hier im Panel — "Werte
        // anzeigen als" (Normal / % vom Gesamtergebnis) gehört per Rechtsklick
        // auf die Wertezelle in der Pivot-Tabelle selbst, genau wie in echtem
        // Excel (siehe openValueCellContextMenu()).
        var cf = calculatedFields[fieldName];
        if (cf) {
          // Berechnete Felder haben keine eigene Aggregation — Excel summiert
          // alle in der Formel verwendeten Basisfelder immer zuerst und
          // wendet die Formel danach auf diese Summen an (siehe
          // aggregateForValueField()); eine Auswahl hier wäre ein
          // wirkungsloses Dropdown.
          var prettyFormula = cf.formula.replace(/^\s*=\s*/, "").replace(/\*/g, "×").replace(/\//g, "÷");
          aggControl = '<div class="calc-field-note">berechnet: ' + escapeAttr(prettyFormula) + "</div>";
        } else {
          var options = aggOptionsFor(fieldName).map(function (opt) {
            var sel = opt === entry.agg ? " selected" : "";
            return '<option value="' + opt + '"' + sel + ">" + opt + "</option>";
          }).join("");
          aggControl = '<select class="agg-select" data-field="' + fieldName + '" data-entry-id="' + entry.id + '">' + options + "</select>";
        }
      }

      // Bei mehreren Feldern in derselben Zone (z.B. Region + Land in Zeilen)
      // legt die Reihenfolge fest, welches Feld außen/innen gruppiert bzw. wie
      // die Wertespalten angeordnet werden — per Pfeiltasten verschiebbar.
      var reorderControl = "";
      if (entries.length > 1) {
        reorderControl =
          (entryIdx > 0 ? '<button class="chip-reorder" type="button" data-dir="-1" aria-label="Nach oben">▲</button>' : "") +
          (entryIdx < entries.length - 1 ? '<button class="chip-reorder" type="button" data-dir="1" aria-label="Nach unten">▼</button>' : "");
      }

      var isDateField = showDateGroups && FIELDS[fieldName].type === "date";
      var pillsHtml = "";
      if (isDateField) {
        var chosen = dateGroupLevels[fieldName] || DEFAULT_DATE_LEVELS;
        pillsHtml = '<div class="dategroup-pills" data-field="' + fieldName + '">' +
          DATE_LEVELS.map(function (lvl) {
            var active = chosen.indexOf(lvl) !== -1;
            return '<button type="button" class="pill' + (active ? " active" : "") + '" data-level="' + lvl + '">' + DATE_LEVEL_LABELS[lvl] + "</button>";
          }).join("") + "</div>";
      }

      // Icon + Feldname + Entfernen-Button bilden die Kopfzeile. Steuerelemente,
      // die selbst schon breit sein können (Aggregations-Dropdown, Datums-
      // Stufen-Pills), stehen bei "multiline"-Chips auf einer eigenen Zeile
      // darunter statt daneben — sonst konkurrieren sie im schmalen Feldbereich
      // um Platz und laufen seitlich über den Kartenrand hinaus.
      var head = '<span class="field-icon">' + FIELDS[fieldName].icon + "</span>" +
        '<span class="chip-text">' + fieldName + "</span>" +
        reorderControl +
        '<button class="chip-remove" type="button" aria-label="Entfernen">×</button>';

      // Ein bereits platziertes Feld ist selbst wieder draggable (data-zone
      // verrät beim Drop in eine andere Zone, woher es kommt, siehe unten) und
      // per Klick auswählbar, um es per Klick auf eine andere Zone zu verschieben.
      // Bei "values" identifiziert die Eintrags-ID die konkrete Instanz
      // (wichtig, sobald dasselbe Feld mehrfach in Werte liegt); bei den
      // anderen Zonen reicht der Feldname.
      var entryIdAttr = zoneKey === "values" ? ' data-entry-id="' + entry.id + '"' : "";
      var isSelectedForMove = zoneKey === "values"
        ? selectedFieldZone === zoneKey && selectedEntryId === entry.id
        : selectedField === fieldName && selectedFieldZone === zoneKey;
      var selCls = isSelectedForMove ? " selected" : "";

      var needsMultiline = isDateField || zoneKey === "values";
      if (needsMultiline) {
        html += '<div class="chip zone-chip zone-chip--multiline' + selCls + '" draggable="true" data-field="' + fieldName + '" data-zone="' + zoneKey + '"' + entryIdAttr + '>' +
          '<div class="zone-chip__head">' + head + "</div>" + pillsHtml + aggControl + "</div>";
      } else {
        html += '<span class="chip zone-chip' + selCls + '" draggable="true" data-field="' + fieldName + '" data-zone="' + zoneKey + '"' + entryIdAttr + '>' + head + "</span>";
      }
    });
    el.innerHTML = html;

    el.querySelectorAll(".chip-remove").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var chip = btn.closest(".zone-chip");
        removeFieldFromZone(chip.dataset.zone, chip.dataset.field, chip.dataset.entryId);
      });
    });

    el.querySelectorAll(".chip-reorder").forEach(function (btn) {
      btn.addEventListener("click", function (e) {
        e.stopPropagation();
        var chip = btn.closest(".zone-chip");
        moveFieldWithinZone(chip.dataset.zone, chip.dataset.field, parseInt(btn.dataset.dir, 10), chip.dataset.entryId);
      });
    });

    el.querySelectorAll(".zone-chip").forEach(function (chip) {
      chip.addEventListener("dragstart", function (e) {
        e.dataTransfer.setData("text/plain", chip.dataset.field);
        e.dataTransfer.setData("application/x-source-zone", chip.dataset.zone);
        e.dataTransfer.setData("application/x-entry-id", chip.dataset.entryId || "");
        chip.classList.add("dragging");
      });
      chip.addEventListener("dragend", function () { chip.classList.remove("dragging"); });
      chip.addEventListener("click", function (e) {
        // Klicks auf Entfernen-Button, Aggregations-Dropdown oder Datums-Pills
        // werden von deren eigenen Handlern behandelt (stopPropagation) bzw.
        // sollen hier keine Verschiebe-Auswahl auslösen.
        if (e.target.closest(".chip-remove") || e.target.closest(".chip-reorder") || e.target.closest(".agg-select") || e.target.closest(".dategroup-pills")) return;
        var fieldName = chip.dataset.field;
        var zone = chip.dataset.zone;
        var entryId = chip.dataset.entryId || null;
        if (selectedField === fieldName && selectedFieldZone === zone && selectedEntryId === entryId) {
          selectedField = null;
          selectedFieldZone = null;
          selectedEntryId = null;
        } else {
          selectedField = fieldName;
          selectedFieldZone = zone;
          selectedEntryId = entryId;
        }
        renderFieldList();
        renderZones();
      });
    });

    if (zoneKey === "values") {
      el.querySelectorAll(".agg-select").forEach(function (select) {
        select.addEventListener("click", function (e) { e.stopPropagation(); });
        select.addEventListener("change", function () {
          setAgg(select.dataset.entryId, select.value);
        });
      });
    }

    if (showDateGroups) {
      el.querySelectorAll(".dategroup-pills .pill").forEach(function (btn) {
        btn.addEventListener("click", function (e) {
          e.stopPropagation();
          var fieldName = btn.closest(".dategroup-pills").dataset.field;
          var current = dateGroupLevels[fieldName] || DEFAULT_DATE_LEVELS.slice();
          var lvl = btn.dataset.level;
          var idx = current.indexOf(lvl);
          if (idx !== -1) {
            if (current.length === 1) return; // mindestens eine Stufe muss aktiv bleiben
            dateGroupLevels[fieldName] = current.filter(function (l) { return l !== lvl; });
          } else {
            dateGroupLevels[fieldName] = current.concat([lvl]);
          }
          renderZones();
          renderPivot();
        });
      });
    }
  }

  function renderZones() {
    Object.keys(zoneEls).forEach(renderZone);
    syncFieldChecks();
  }

  // ---------- Drag & Drop + Klick-Fallback auf Zonen ----------
  Object.keys(zoneEls).forEach(function (zoneKey) {
    var dropEl = zoneEls[zoneKey].closest(".dropzone");

    dropEl.addEventListener("dragover", function (e) {
      e.preventDefault();
      dropEl.classList.add("dragover");
    });
    dropEl.addEventListener("dragleave", function () { dropEl.classList.remove("dragover"); });
    dropEl.addEventListener("drop", function (e) {
      e.preventDefault();
      dropEl.classList.remove("dragover");
      var fieldName = e.dataTransfer.getData("text/plain");
      if (!fieldName || !FIELDS[fieldName]) return;
      // Kommt der Drag von einem bereits platzierten Zonen-Chip (statt aus der
      // Feldliste), steht hier die Ursprungszone drin — das Feld wird dann
      // verschoben statt dupliziert.
      var sourceZone = e.dataTransfer.getData("application/x-source-zone") || null;
      var entryId = e.dataTransfer.getData("application/x-entry-id") || null;
      moveFieldToZone(fieldName, sourceZone, zoneKey, entryId);
    });

    dropEl.addEventListener("click", function (e) {
      if (e.target.closest(".zone-chip")) return; // handled separately
      if (selectedField) {
        moveFieldToZone(selectedField, selectedFieldZone, zoneKey, selectedEntryId);
        selectedField = null;
        selectedFieldZone = null;
        selectedEntryId = null;
        renderFieldList();
      }
    });
  });

  // ---------- Pivot-Berechnung ----------
  // Löst ein Feld für eine Datenzeile zu einem {sort, label}-Paar auf: bei
  // Nicht-Datumsfeldern einfach der Rohwert, bei Datumsfeldern die gewählte(n)
  // Gruppierungsstufe(n) (Jahr/Quartal/Monat/Tag). "sort" ist maschinell
  // vergleichbar (chronologisch korrekt, unabhängig von Textformatierung),
  // "label" ist die Anzeige im Pivot.
  function dateLevelValue(date, level) {
    var year = date.getUTCFullYear(), month = date.getUTCMonth(), day = date.getUTCDate();
    if (level === "jahr") return { sort: String(year).padStart(4, "0"), label: String(year) };
    if (level === "quartal") { var q = Math.floor(month / 3) + 1; return { sort: "Q" + q, label: "Q" + q }; }
    if (level === "monat") return { sort: String(month + 1).padStart(2, "0"), label: MONTH_NAMES[month] };
    return { sort: String(day).padStart(2, "0"), label: String(day).padStart(2, "0") + "." }; // "tag"
  }

  function fieldValue(fieldName, row, levelsMap) {
    if (FIELDS[fieldName].type !== "date") {
      var v = String(row[fieldName]);
      return { sort: v, label: v };
    }
    var chosen = (levelsMap && levelsMap[fieldName] && levelsMap[fieldName].length) ? levelsMap[fieldName] : DEFAULT_DATE_LEVELS;
    var ordered = DATE_LEVELS.filter(function (l) { return chosen.indexOf(l) !== -1; });
    if (!ordered.length) ordered = DEFAULT_DATE_LEVELS;
    var parts = ordered.map(function (l) { return dateLevelValue(row[fieldName], l); });
    return {
      sort: parts.map(function (p) { return p.sort; }).join("-"),
      label: parts.map(function (p) { return p.label; }).join(" ")
    };
  }

  // Eindeutige Gruppierungs-Kombinationen für ein Set von Feldern, chronologisch
  // bzw. alphabetisch (de) sortiert je nach Feldtyp.
  function computeGroupCombos(fields, data, levelsMap) {
    if (fields.length === 0) return [{ key: "", label: "Gesamt", sortParts: [], parts: [] }];
    var map = new Map();
    data.forEach(function (row) {
      var vals = fields.map(function (f) { return fieldValue(f, row, levelsMap); });
      var key = vals.map(function (v) { return v.sort; }).join(" | ");
      if (!map.has(key)) {
        map.set(key, {
          key: key,
          label: vals.map(function (v) { return v.label; }).join(" / "),
          sortParts: vals.map(function (v) { return v.sort; }),
          // Feld+Anzeigewert je Gruppierungsfeld, unabhängig von Zeilen/Spalten-Zuordnung —
          // wird für die GETPIVOTDATA-artige Formel in der Formelleiste gebraucht.
          parts: fields.map(function (f, idx) { return { field: f, label: vals[idx].label }; })
        });
      }
    });
    var combos = Array.from(map.values());
    combos.sort(function (a, b) {
      for (var i = 0; i < a.sortParts.length; i++) {
        var isDate = FIELDS[fields[i]].type === "date";
        var cmp = isDate
          ? (a.sortParts[i] < b.sortParts[i] ? -1 : a.sortParts[i] > b.sortParts[i] ? 1 : 0)
          : a.sortParts[i].localeCompare(b.sortParts[i], "de");
        if (cmp) return cmp;
      }
      return 0;
    });
    return combos;
  }

  function rowMatchesCombo(row, fields, combo, levelsMap) {
    if (fields.length === 0) return true;
    return fields.map(function (f) { return fieldValue(f, row, levelsMap).sort; }).join(" | ") === combo.key;
  }

  // Baut die Anzeige-Zeilen für den Zeilen-Bereich auf. Bei nur einem Feld
  // ist das Ergebnis flach (eine "Zeile" je Wert, wie bisher). Liegen zwei
  // oder mehr Felder gleichzeitig in Zeilen, wird stattdessen rekursiv eine
  // ein-/ausklappbare Gliederung gebaut: das erste Feld bildet die äußeren
  // Gruppen (mit Zwischensumme + Auf-/Zuklapp-Pfeil), jedes weitere Feld eine
  // Ebene tiefer — genau wie ein "kompaktes" Excel-PivotTable-Layout mit
  // mehreren Feldern im selben Bereich.
  // orderKeys: optional — feste Reihenfolge der obersten Ebene anhand ihrer
  // Kombi-Keys (z.B. nach Wert sortiert durch einen aktiven Wertefilter).
  // Überschreibt sortDir, wenn gesetzt.
  // Zerlegt die Zeilenfelder in einzelne "Gruppierungsschritte": ein
  // normales Feld ist EIN Schritt, ein Datumsfeld mit mehreren aktiven
  // Gruppierungsstufen (z.B. Jahr + Quartal) wird in mehrere Schritte
  // aufgeteilt — einen je Stufe, in der festen Kalenderreihenfolge
  // (Jahr → Quartal → Monat → Tag). Dadurch entsteht für "ein Feld, zwei
  // Stufen" dieselbe ein-/ausklappbare Gliederung wie für "zwei Felder in
  // derselben Zone" (z.B. Region + Land) — ohne zwei separate Code-Pfade.
  function expandGroupingSteps(fields, levelsMap) {
    var steps = [];
    fields.forEach(function (f) {
      if (FIELDS[f].type !== "date") {
        steps.push({ field: f, isDateLevel: false });
        return;
      }
      var chosen = (levelsMap && levelsMap[f] && levelsMap[f].length) ? levelsMap[f] : DEFAULT_DATE_LEVELS;
      var ordered = DATE_LEVELS.filter(function (l) { return chosen.indexOf(l) !== -1; });
      if (!ordered.length) ordered = DEFAULT_DATE_LEVELS;
      ordered.forEach(function (level) { steps.push({ field: f, level: level, isDateLevel: true }); });
    });
    return steps;
  }

  function computeGroupCombosForStep(step, data) {
    if (!step.isDateLevel) return computeGroupCombos([step.field], data, {});
    var map = new Map();
    data.forEach(function (row) {
      var v = dateLevelValue(row[step.field], step.level);
      if (!map.has(v.sort)) {
        map.set(v.sort, { key: v.sort, label: v.label, parts: [{ field: step.field, label: v.label, level: step.level }] });
      }
    });
    var combos = Array.from(map.values());
    combos.sort(function (a, b) { return a.key < b.key ? -1 : a.key > b.key ? 1 : 0; });
    return combos;
  }

  function rowMatchesStepCombo(row, step, combo) {
    if (!step.isDateLevel) return rowMatchesCombo(row, [step.field], combo, {});
    return dateLevelValue(row[step.field], step.level).sort === combo.key;
  }

  function buildRowDisplayList(fields, data, levelsMap, sortDir, orderKeys) {
    if (!fields.length) return [];
    var steps = expandGroupingSteps(fields, levelsMap);
    function recurse(stepIdx, subData, parentKey, parentParts) {
      var step = steps[stepIdx];
      var combos = computeGroupCombosForStep(step, subData);
      if (stepIdx === 0 && !orderKeys) {
        if (sortDir === "asc") combos.sort(function (a, b) { return a.label.localeCompare(b.label, "de"); });
        else if (sortDir === "desc") combos.sort(function (a, b) { return b.label.localeCompare(a.label, "de"); });
      }
      var isLast = stepIdx === steps.length - 1;
      var out = [];
      // Für "Werte anzeigen als"-Modi, die mehr als nur die eigene Zeile
      // brauchen: parentData (übergeordnetes Zeilenergebnis, für "% vom
      // übergeordneten Element"), prevSiblingData (Vorgänger auf derselben
      // Ebene, für "Differenz von"/"% Differenz von" — null beim ersten
      // Element, dann bleibt die Zelle leer wie in echtem Excel) und
      // cumulativeData (alle Geschwister bis einschließlich diesem, für
      // "Laufende Summe in").
      var cumulativeSoFar = [];
      var prevData = null;
      combos.forEach(function (combo) {
        var comboData = subData.filter(function (d) { return rowMatchesStepCombo(d, step, combo); });
        cumulativeSoFar = cumulativeSoFar.concat(comboData);
        var fullKey = (parentKey ? parentKey + "‖" : "") + step.field + (step.isDateLevel ? "@" + step.level : "") + "=" + combo.key;
        var parts = parentParts.concat(combo.parts);
        var shared = { data: comboData, parts: parts, parentData: subData, prevSiblingData: prevData, cumulativeData: cumulativeSoFar };
        if (isLast) {
          out.push(Object.assign({ level: stepIdx, isGroup: false, label: combo.label, key: fullKey }, shared));
        } else {
          var collapsed = !!collapsedRowGroups[fullKey];
          out.push(Object.assign({ level: stepIdx, isGroup: true, label: combo.label, key: fullKey, collapsed: collapsed }, shared));
          if (!collapsed) out = out.concat(recurse(stepIdx + 1, comboData, fullKey, parts));
        }
        prevData = comboData;
      });
      return out;
    }
    var result = recurse(0, data, "", []);
    if (orderKeys) {
      var byKey = {};
      result.forEach(function (e) { byKey[e.key] = e; });
      result = orderKeys.map(function (k) { return byKey[k]; }).filter(Boolean);
    }
    return result;
  }

  // Wendet einen Wertefilter ("Top"/"Unten" N nach einem Wertefeld) auf die
  // Daten an, bevor überhaupt gruppiert wird — wie rowLabelHidden ein
  // echter Datenfilter, nur nach Rang statt manueller Auswahl. Gibt neben
  // den gefilterten Daten auch die nach Wert sortierte Reihenfolge zurück,
  // damit die Anzeige (und nicht nur die Auswahl) "Top zuerst" zeigt.
  function applyValueFilterToData(data, rowFields, levelsMap, vf) {
    if (!vf || rowFields.length !== 1) return { data: data, orderKeys: null };
    var combos = computeGroupCombos(rowFields, data, levelsMap);
    var scored = combos.map(function (c) {
      var matched = data.filter(function (d) { return rowMatchesCombo(d, rowFields, c, levelsMap); });
      return { key: c.key, val: aggregateForValueField(vf, matched) };
    });
    scored.sort(function (a, b) { return vf.type === "bottom" ? a.val - b.val : b.val - a.val; });
    var kept = scored.slice(0, vf.n);
    var keepKeys = {};
    kept.forEach(function (s) { keepKeys[s.key] = true; });
    var filtered = data.filter(function (d) {
      var key = rowFields.map(function (f) { return fieldValue(f, d, levelsMap).sort; }).join(" | ");
      return keepKeys[key];
    });
    return { data: filtered, orderKeys: kept.map(function (s) { return s.key; }) };
  }

  function rowDisplayCellCls(entry) {
    return "rowlabel" + (entry.level > 0 ? " row-indent-" + entry.level : "") + (entry.isGroup ? " row-group" : "");
  }

  function rowDisplayLabelHtml(entry) {
    var toggle = entry.isGroup
      ? '<span class="row-group-toggle" data-group-key="' + escapeAttr(entry.key) + '">' + (entry.collapsed ? "▸" : "▾") + "</span> "
      : "";
    return toggle + escapeAttr(entry.label);
  }

  function fieldAxisLabel(fieldName, levelsMap) {
    if (FIELDS[fieldName].type !== "date") return fieldName;
    var chosen = (levelsMap && levelsMap[fieldName] && levelsMap[fieldName].length) ? levelsMap[fieldName] : DEFAULT_DATE_LEVELS;
    var ordered = DATE_LEVELS.filter(function (l) { return chosen.indexOf(l) !== -1; });
    return fieldName + " (" + ordered.map(function (l) { return DATE_LEVEL_LABELS[l]; }).join("/") + ")";
  }

  var AGG_FUNC_NAME = { Summe: "SUMME", Anzahl: "ANZAHL", Mittelwert: "MITTELWERT", Min: "MIN", Max: "MAX" };

  // Formel für eine Zelle in der Gesamt-Zeile: die entspricht tatsächlich der
  // im Raster sichtbaren Summe/Anzahl/... der Datenzeilen in derselben Spalte.
  function totalColumnFormula(agg, colLetter, firstRow, lastRow) {
    return "=" + AGG_FUNC_NAME[agg] + "(" + colLetter + firstRow + ":" + colLetter + lastRow + ")";
  }

  // Formel für eine normale Pivot-Datenzelle: eine PivotTable liefert selbst
  // keine sichtbare Formel (nur den berechneten Wert), aber genau dafür gibt
  // es GETPIVOTDATA — die Formel, die Excel einfügt, wenn man von außen auf
  // eine Pivot-Zelle verweist. Didaktisch die treffendste Darstellung dessen,
  // "was diese Zelle bedeutet".
  function pivotDataFormula(fieldName, filterParts, anchorCell) {
    var s = '=GETPIVOTDATA("' + fieldName + '";' + anchorCell;
    filterParts.forEach(function (p) { s += ';"' + p.field + '";"' + p.label + '"'; });
    return s + ")";
  }

  function escapeAttr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  // Aktive Zelle: Namensfeld + Formel aktualisieren. Persistenter Klick-Handler
  // (einmalig gebunden, siehe unten) statt pro Render neu angehängt, da
  // #sheet-canvas als Element selbst bei jedem Render erhalten bleibt.
  function activateCell(cell) {
    var prevActive = document.querySelector(".sheet-cell--active");
    if (prevActive) prevActive.classList.remove("sheet-cell--active");
    cell.classList.add("sheet-cell--active");
    highlightActiveHeaders(cell);
    document.getElementById("formula-namebox").textContent = cell.dataset.addr;
    document.getElementById("formula-text").textContent = cell.dataset.formula;
  }

  // Wie in Excel: Spaltenbuchstabe und Zeilennummer der aktiven Zelle hervorheben.
  function highlightActiveHeaders(cell) {
    var table = cell.closest("table");
    if (!table) return;
    table.querySelectorAll(".sheet-colheads th.is-active, .sheet-rownum.is-active").forEach(function (h) {
      h.classList.remove("is-active");
    });
    var m = /^([A-Z]+)(\d+)$/.exec(cell.dataset.addr || "");
    if (!m) return;
    table.querySelectorAll(".sheet-colheads th").forEach(function (th) {
      if (th.textContent === m[1]) th.classList.add("is-active");
    });
    var rownum = table.querySelectorAll(".sheet-rownum")[parseInt(m[2], 10) - 1];
    if (rownum) rownum.classList.add("is-active");
  }

  // Die im HTML-String vergebenen "top"-Werte für fixierte Zeilen beruhen auf
  // einer angenommenen Zeilenhöhe (ROW_H) — Schriftgrößen/Innenabstände weichen
  // davon aber leicht ab, je nachdem wie viele fixierte Zeilen (Kopfzeile(n),
  // ggf. Filterzeilen) übereinander gestapelt werden. Nach dem Rendern anhand
  // der tatsächlich gemessenen Höhen korrigieren, statt die Konstante ewig
  // nachzujustieren — bleibt so auch bei künftigen Stil-Anpassungen korrekt.
  function fixStickyOffsets(canvas) {
    var colheadsRow = canvas.querySelector(".sheet-colheads");
    var offset = colheadsRow ? colheadsRow.getBoundingClientRect().height : 0;
    canvas.querySelectorAll(".sheet-header-row").forEach(function (tr) {
      var h = tr.getBoundingClientRect().height;
      Array.prototype.forEach.call(tr.children, function (cell) { cell.style.top = offset + "px"; });
      offset += h;
    });
  }

  // ---------- Filter-Bereich: auswählbar/echt filternd ----------
  // fieldName -> ausgewähltes Label (String) oder kein Eintrag = "(Alle)".
  var filterSelections = {};

  function filterFieldLabel(fieldName, raw) {
    if (FIELDS[fieldName].type === "date") return formatDate(raw);
    if (FIELDS[fieldName].type === "percent") return formatPercent(raw);
    if (FIELDS[fieldName].type === "number") return formatCurrency(raw);
    return String(raw);
  }

  function uniqueFilterValues(fieldName) {
    var seen = {};
    var out = [];
    DATA.forEach(function (d) {
      var raw = d[fieldName];
      var label = filterFieldLabel(fieldName, raw);
      if (!seen[label]) { seen[label] = true; out.push({ raw: raw, label: label }); }
    });
    out.sort(function (a, b) {
      if (FIELDS[fieldName].type !== "text") return a.raw < b.raw ? -1 : a.raw > b.raw ? 1 : 0;
      return a.label.localeCompare(b.label, "de");
    });
    return out;
  }

  // Wendet die aktuell im Filter-Bereich gewählten Werte tatsächlich auf die
  // Datengrundlage an — nicht nur kosmetisch, die ganze Pivot-Berechnung
  // (Gruppierung, Aggregation, Summen) rechnet mit dieser gefilterten Menge.
  function getFilteredData() {
    if (!zones.filter.length) return DATA;
    return DATA.filter(function (d) {
      return zones.filter.every(function (ff) {
        var sel = filterSelections[ff];
        return !sel || filterFieldLabel(ff, d[ff]) === sel;
      });
    });
  }

  function closeFilterDropdown() {
    var dd = document.getElementById("filter-dropdown");
    if (dd) dd.remove();
  }

  function openFilterDropdown(cell, fieldName) {
    closeFilterDropdown();
    var canvas = document.getElementById("sheet-canvas");
    var current = filterSelections[fieldName];
    var values = uniqueFilterValues(fieldName);
    var html = '<div class="filter-dropdown" id="filter-dropdown">' +
      '<div class="filter-dropdown__item' + (!current ? " active" : "") + '" data-value="">(Alle)</div>' +
      values.map(function (v) {
        return '<div class="filter-dropdown__item' + (current === v.label ? " active" : "") + '" data-value="' + escapeAttr(v.label) + '">' + v.label + "</div>";
      }).join("") +
      "</div>";
    canvas.insertAdjacentHTML("beforeend", html);
    var dd = document.getElementById("filter-dropdown");
    dd.style.left = cell.offsetLeft + "px";
    dd.style.top = (cell.offsetTop + cell.offsetHeight) + "px";
    dd.addEventListener("click", function (e) {
      var item = e.target.closest(".filter-dropdown__item");
      if (!item) return;
      e.stopPropagation();
      if (item.dataset.value) filterSelections[fieldName] = item.dataset.value;
      else delete filterSelections[fieldName];
      closeFilterDropdown();
      renderPivot();
    });
  }

  // ---------- Zeilenbeschriftungen: Sortier-/Filtermenü (Excel-Nachbau) ----------
  // Ausgeblendete Zeilen-Kombinationen (Kombi-Key, siehe computeGroupCombos) und
  // gewählte Sortierrichtung — wirken erst nach Klick auf "OK" im Menü, wirken
  // dann aber echt auf die Pivot-Berechnung (nicht nur kosmetisch).
  var rowLabelHidden = [];
  var rowLabelSortDir = null; // null | "asc" | "desc"
  // Liegen mehrere Felder gleichzeitig in Zeilen (z.B. Region UND Land),
  // werden sie als ein-/ausklappbare Gliederung angezeigt statt als flach
  // kombinierte "Region / Land"-Zeile. Key -> true, wenn diese Gruppe
  // eingeklappt ist (siehe buildRowDisplayList()).
  var collapsedRowGroups = {};
  // Wertefilter ("Top 10"-artig): { type: "top"|"bottom", n, field, agg } oder
  // null. Wirkt wie rowLabelHidden als echter Datenfilter (siehe
  // applyValueFilterToData()), nicht nur kosmetisch.
  var valueFilter = null;
  var valueFilterFormOpen = false; // Auf-/zugeklappt im Zeilenbeschriftungen-Menü
  // Während das Menü offen ist: Arbeitskopie der Auswahl, erst bei "OK" in
  // rowLabelHidden übernommen — wie in echtem Excel (Abbrechen verwirft sie).
  var rowLabelMenuDraftHidden = null;
  var rowLabelMenuSearch = "";

  function closeRowLabelFilterMenu() {
    var el = document.getElementById("rowlabel-filter-menu");
    if (el) el.remove();
    rowLabelMenuDraftHidden = null;
    rowLabelMenuSearch = "";
    valueFilterFormOpen = false;
  }

  // Rechtsklick-Kontextmenü auf einer Wertezelle — "Werte anzeigen als"
  // (Normal / % vom Gesamtergebnis) gehört hierher statt ins Feld-Panel,
  // genau wie im echten Excel.
  function closeValueCellContextMenu() {
    var el = document.getElementById("value-context-menu");
    if (el) el.remove();
  }

  // Modi, die zusätzlich ein Basisfeld brauchen (die restlichen Modi wenden
  // sich sofort an, ohne Zwischenschritt).
  var SHOWAS_NEEDS_BASE = { differenceFrom: true, percentDifferenceFrom: true, runningTotal: true };
  var SHOWAS_OPTIONS = [
    { value: "", label: "Normal" },
    { value: "percentOfTotal", label: "% vom Gesamtergebnis" },
    { value: "percentOfParentRow", label: "% vom übergeordneten Zeilenergebnis" },
    { value: "differenceFrom", label: "Differenz von …" },
    { value: "percentDifferenceFrom", label: "% Differenz von …" },
    { value: "runningTotal", label: "Laufende Summe in …" }
  ];

  function openValueCellContextMenu(cell, clientX, clientY) {
    closeValueCellContextMenu();
    closeFilterDropdown();
    closeRowLabelFilterMenu();
    var entryId = cell.dataset.vfId;
    var entry = findValueEntry(entryId);
    if (!entry) return;
    var canvas = document.getElementById("sheet-canvas");
    var canvasRect = canvas.getBoundingClientRect();
    var left = clientX - canvasRect.left + canvas.scrollLeft;
    var top = clientY - canvasRect.top + canvas.scrollTop;
    var pendingBaseMode = null; // während der Basisfeld-Auswahl gesetzt

    function baseFieldOptions() {
      var candidates = zones.rows.concat(zones.columns);
      var seen = {};
      candidates = candidates.filter(function (f) { return seen[f] ? false : (seen[f] = true); });
      return candidates;
    }

    function renderMenuHtml() {
      if (pendingBaseMode) {
        var fields = baseFieldOptions();
        if (!fields.length) {
          return '<div class="vcm-header">Basisfeld wählen</div>' +
            '<div class="rlm-item rlm-item--disabled">Kein Zeilen-/Spaltenfeld verfügbar</div>' +
            '<div class="rlm-actions"><button type="button" class="rlm-btn" data-action="vcm-back">Zurück</button></div>';
        }
        var fieldOptionsHtml = fields.map(function (f) {
          var sel = f === entry.showAsBase ? " selected" : "";
          return '<option value="' + escapeAttr(f) + '"' + sel + ">" + escapeAttr(f) + "</option>";
        }).join("");
        return '<div class="vcm-header">Basisfeld</div>' +
          '<div class="rlm-valuefilter"><select id="vcm-base-field">' + fieldOptionsHtml + "</select>" +
          '<div class="rlm-vf-actions">' +
            '<button type="button" class="rlm-btn rlm-btn--primary" data-action="vcm-apply-base">Übernehmen</button>' +
            '<button type="button" class="rlm-btn" data-action="vcm-back">Zurück</button>' +
          "</div></div>";
      }
      var current = entry.showAs || "";
      return '<div class="vcm-header">Werte anzeigen als</div>' +
        SHOWAS_OPTIONS.map(function (o) {
          return '<div class="rlm-item" data-value="' + o.value + '">' + escapeAttr(o.label) +
            (current === o.value ? ' <span class="vcm-check">✓</span>' : "") + "</div>";
        }).join("");
    }

    canvas.insertAdjacentHTML("beforeend", '<div class="value-context-menu" id="value-context-menu">' + renderMenuHtml() + "</div>");
    var menu = document.getElementById("value-context-menu");
    menu.style.left = left + "px";
    menu.style.top = top + "px";
    menu.addEventListener("click", function (e) {
      e.stopPropagation();
      var actionEl = e.target.closest("[data-action]");
      if (actionEl) {
        if (actionEl.dataset.action === "vcm-back") {
          pendingBaseMode = null;
          menu.innerHTML = renderMenuHtml();
        } else if (actionEl.dataset.action === "vcm-apply-base") {
          var baseField = document.getElementById("vcm-base-field").value;
          setShowAs(entryId, pendingBaseMode, baseField);
          closeValueCellContextMenu();
        }
        return;
      }
      var item = e.target.closest("[data-value]");
      if (!item) return;
      var value = item.dataset.value;
      if (SHOWAS_NEEDS_BASE[value]) {
        pendingBaseMode = value;
        menu.innerHTML = renderMenuHtml();
        return;
      }
      setShowAs(entryId, value || null, null);
      closeValueCellContextMenu();
    });
  }

  function rowLabelMenuCombos() {
    return computeGroupCombos(zones.rows, getFilteredData(), dateGroupLevels);
  }

  // "Wertefilter" (Top/Unten N nach einem Wertefeld) — echte Funktion statt
  // des vorherigen inerten Menüpunkts. Braucht mindestens ein Wertefeld, um
  // überhaupt etwas zu haben, wonach gerankt werden kann.
  function renderValueFilterBlock() {
    if (!zones.values.length) {
      return '<div class="rlm-item rlm-item--disabled">Wertefilter (erst ein Feld in „Werte“ ablegen)</div>';
    }
    var active = !!valueFilter;
    return '<div class="rlm-item" data-action="toggle-valuefilter">Wertefilter' +
      (active ? ' <span class="rlm-vf-badge">●</span>' : "") +
      ' <span class="rlm-arrow">' + (valueFilterFormOpen ? "▾" : "▸") + "</span></div>" +
      (valueFilterFormOpen ? renderValueFilterForm() : "");
  }

  function renderValueFilterForm() {
    var vf = valueFilter || { type: "top", n: 5, field: zones.values[0].field, agg: zones.values[0].agg };
    var fieldOptions = zones.values.map(function (v) {
      var val = v.field + "|" + v.agg;
      var sel = (vf.field === v.field && vf.agg === v.agg) ? " selected" : "";
      return '<option value="' + escapeAttr(val) + '"' + sel + '>' + escapeAttr(v.agg + " von " + v.field) + "</option>";
    }).join("");
    return '<div class="rlm-valuefilter">' +
      '<div class="rlm-vf-row">' +
        '<select id="rlm-vf-type">' +
          '<option value="top"' + (vf.type === "top" ? " selected" : "") + ">Top</option>" +
          '<option value="bottom"' + (vf.type === "bottom" ? " selected" : "") + ">Unten</option>" +
        "</select>" +
        '<input type="number" id="rlm-vf-n" min="1" max="50" value="' + vf.n + '">' +
        '<span class="rlm-vf-label">nach</span>' +
      "</div>" +
      '<select id="rlm-vf-field" class="rlm-vf-field-select">' + fieldOptions + "</select>" +
      '<div class="rlm-vf-actions">' +
        '<button type="button" class="rlm-btn rlm-btn--primary" data-action="apply-valuefilter">Übernehmen</button>' +
        (valueFilter ? '<button type="button" class="rlm-btn" data-action="clear-valuefilter">Entfernen</button>' : "") +
      "</div>" +
    "</div>";
  }

  function renderRowLabelFilterMenuHtml() {
    var fieldName = zones.rows[0];
    var combos = rowLabelMenuCombos();
    var hiddenSet = {};
    rowLabelMenuDraftHidden.forEach(function (k) { hiddenSet[k] = true; });
    var term = rowLabelMenuSearch.trim().toLowerCase();
    var visibleCombos = term ? combos.filter(function (c) { return c.label.toLowerCase().indexOf(term) !== -1; }) : combos;
    var allVisibleChecked = visibleCombos.length > 0 && visibleCombos.every(function (c) { return !hiddenSet[c.key]; });
    var hasActiveFilter = rowLabelHidden.length > 0;

    return '' +
      '<div class="rlm-item" data-action="sort-asc">Von A bis Z sortieren</div>' +
      '<div class="rlm-item" data-action="sort-desc">Von Z bis A sortieren</div>' +
      '<div class="rlm-item rlm-item--disabled">Weitere Sortieroptionen…</div>' +
      '<div class="rlm-sep"></div>' +
      '<div class="rlm-item' + (hasActiveFilter ? "" : " rlm-item--disabled") + '" data-action="clear-filter">Filter entfernen aus &bdquo;' + escapeAttr(fieldName) + '&ldquo;</div>' +
      '<div class="rlm-item rlm-item--disabled">Beschriftungsfilter <span class="rlm-arrow">▸</span></div>' +
      renderValueFilterBlock() +
      '<div class="rlm-sep"></div>' +
      '<div class="rlm-search-wrap"><input type="text" class="rlm-search" id="rlm-search-input" placeholder="Suchen" value="' + escapeAttr(rowLabelMenuSearch) + '"></div>' +
      '<div class="rlm-list" id="rlm-list">' +
        '<label class="rlm-check-row"><input type="checkbox" data-action="toggle-all"' + (allVisibleChecked ? " checked" : "") + '> (Alle anzeigen)</label>' +
        visibleCombos.map(function (c) {
          return '<label class="rlm-check-row"><input type="checkbox" data-key="' + escapeAttr(c.key) + '"' + (hiddenSet[c.key] ? "" : " checked") + '> ' + escapeAttr(c.label) + '</label>';
        }).join("") +
      '</div>' +
      '<div class="rlm-actions">' +
        '<button type="button" class="rlm-btn rlm-btn--primary" data-action="ok">OK</button>' +
        '<button type="button" class="rlm-btn" data-action="cancel">Abbrechen</button>' +
      '</div>';
  }

  function refreshRowLabelFilterMenuList() {
    var list = document.getElementById("rlm-list");
    if (!list) return;
    var combos = rowLabelMenuCombos();
    var hiddenSet = {};
    rowLabelMenuDraftHidden.forEach(function (k) { hiddenSet[k] = true; });
    var term = rowLabelMenuSearch.trim().toLowerCase();
    var visibleCombos = term ? combos.filter(function (c) { return c.label.toLowerCase().indexOf(term) !== -1; }) : combos;
    var allVisibleChecked = visibleCombos.length > 0 && visibleCombos.every(function (c) { return !hiddenSet[c.key]; });
    list.innerHTML = '<label class="rlm-check-row"><input type="checkbox" data-action="toggle-all"' + (allVisibleChecked ? " checked" : "") + '> (Alle anzeigen)</label>' +
      visibleCombos.map(function (c) {
        return '<label class="rlm-check-row"><input type="checkbox" data-key="' + escapeAttr(c.key) + '"' + (hiddenSet[c.key] ? "" : " checked") + '> ' + escapeAttr(c.label) + '</label>';
      }).join("");
  }

  function openRowLabelFilterMenu(cell) {
    closeFilterDropdown();
    closeRowLabelFilterMenu();
    if (!zones.rows.length) return;
    rowLabelMenuDraftHidden = rowLabelHidden.slice();
    var canvas = document.getElementById("sheet-canvas");
    canvas.insertAdjacentHTML("beforeend", '<div class="rowlabel-filter-menu" id="rowlabel-filter-menu">' + renderRowLabelFilterMenuHtml() + "</div>");
    var menu = document.getElementById("rowlabel-filter-menu");
    menu.style.left = cell.offsetLeft + "px";
    menu.style.top = (cell.offsetTop + cell.offsetHeight) + "px";

    menu.addEventListener("click", function (e) {
      e.stopPropagation();
      var actionEl = e.target.closest("[data-action]");
      if (!actionEl) return;
      var action = actionEl.dataset.action;
      if (action === "sort-asc" || action === "sort-desc") {
        rowLabelSortDir = action === "sort-asc" ? "asc" : "desc";
        closeRowLabelFilterMenu();
        renderPivot();
      } else if (action === "clear-filter") {
        if (!rowLabelHidden.length) return;
        rowLabelHidden = [];
        closeRowLabelFilterMenu();
        renderPivot();
      } else if (action === "ok") {
        rowLabelHidden = rowLabelMenuDraftHidden.slice();
        closeRowLabelFilterMenu();
        renderPivot();
      } else if (action === "cancel") {
        closeRowLabelFilterMenu();
      } else if (action === "toggle-all") {
        var checked = actionEl.checked;
        var combos = rowLabelMenuCombos();
        var term = rowLabelMenuSearch.trim().toLowerCase();
        var visibleCombos = term ? combos.filter(function (c) { return c.label.toLowerCase().indexOf(term) !== -1; }) : combos;
        var visibleKeys = {};
        visibleCombos.forEach(function (c) { visibleKeys[c.key] = true; });
        // Nur die aktuell sichtbaren (ggf. durch die Suche gefilterten)
        // Einträge an-/abwählen — wie in echtem Excel.
        rowLabelMenuDraftHidden = rowLabelMenuDraftHidden.filter(function (k) { return !visibleKeys[k]; });
        if (!checked) visibleCombos.forEach(function (c) { rowLabelMenuDraftHidden.push(c.key); });
        refreshRowLabelFilterMenuList();
      } else if (action === "toggle-valuefilter") {
        valueFilterFormOpen = !valueFilterFormOpen;
        menu.innerHTML = renderRowLabelFilterMenuHtml();
      } else if (action === "apply-valuefilter") {
        var typeSel = document.getElementById("rlm-vf-type");
        var nInput = document.getElementById("rlm-vf-n");
        var fieldSel = document.getElementById("rlm-vf-field");
        var n = parseInt(nInput.value, 10);
        if (!n || n < 1) n = 5;
        var parts = fieldSel.value.split("|");
        valueFilter = { type: typeSel.value, n: n, field: parts[0], agg: parts[1] };
        closeRowLabelFilterMenu();
        renderPivot();
      } else if (action === "clear-valuefilter") {
        valueFilter = null;
        closeRowLabelFilterMenu();
        renderPivot();
      }
    });
    menu.addEventListener("change", function (e) {
      var box = e.target.closest("input[data-key]");
      if (!box) return;
      var key = box.dataset.key;
      if (box.checked) rowLabelMenuDraftHidden = rowLabelMenuDraftHidden.filter(function (k) { return k !== key; });
      else if (rowLabelMenuDraftHidden.indexOf(key) === -1) rowLabelMenuDraftHidden.push(key);
      refreshRowLabelFilterMenuList();
    });
    menu.addEventListener("input", function (e) {
      if (e.target.id !== "rlm-search-input") return;
      rowLabelMenuSearch = e.target.value;
      refreshRowLabelFilterMenuList();
    });
    menu.addEventListener("keydown", function (e) { e.stopPropagation(); });
  }

  // Klick irgendwo außerhalb schließt das offene Dropdown/Menü wieder — Klicks
  // auf das Dropdown/Menü selbst oder die auslösende Zelle (öffnen/schließen es
  // gezielt via eigenem Handler) werden hier bewusst ignoriert.
  document.addEventListener("click", function (e) {
    if (!e.target.closest(".filter-dropdown") && !e.target.closest(".filter-value-cell")) closeFilterDropdown();
    if (!e.target.closest(".rowlabel-filter-menu") && !e.target.closest(".rowlabel-filter-cell")) closeRowLabelFilterMenu();
    if (!e.target.closest(".value-context-menu")) closeValueCellContextMenu();
    if (!e.target.closest(".excel-ribbon__menu") && !e.target.closest("#ribbon-fields-groups-btn")) closeRibbonMenu();
  });

  function renderPivot() {
    var canvas = document.getElementById("sheet-canvas");
    var rowFields = zones.rows;
    var colFields = zones.columns;
    var valueFields = zones.values;
    var filterFields = zones.filter;
    var pivotRows = [];
    var pivotColCount = 1;
    var showEmptyOverlay = false;

    // Filter-Bereich: immer zuerst aufgebaut, unabhängig davon, ob sonst schon
    // Zeilen/Spalten/Werte gewählt sind — soll schon sichtbar (und nutzbar)
    // sein, sobald ein Feld dort abgelegt wird, genau wie in echtem Excel.
    // Eine Zeile "Feldname | ausgewählter Wert" je Filterfeld, plus eine
    // Leerzeile als Abstand; alles darunter rückt entsprechend nach unten.
    // Die Wert-Zelle ist klickbar (filter-value-cell) und öffnet ein
    // Dropdown mit den tatsächlichen Werten dieses Felds.
    filterFields.forEach(function (ff) {
      var label = filterSelections[ff] || "(Alle)";
      var frow = [
        { header: true, cls: "rowlabel pivot-header-row", html: ff },
        {
          header: true,
          cls: "pivot-header-row filter-value-cell",
          html: label + ' <span class="pivot-filter-btn"></span>',
          attrs: ' data-filter-field="' + escapeAttr(ff) + '"'
        }
      ];
      pivotRows.push(frow);
    });
    if (filterFields.length) pivotRows.push([]);
    var rowOffset = filterFields.length ? filterFields.length + 1 : 0;

    if (rowFields.length === 0 && colFields.length === 0) {
      // Noch kein Zeilen-/Spaltenfeld abgelegt: trotzdem ein echtes,
      // leeres Excel-Raster zeigen (Spaltenköpfe/Zeilennummern/Gitter genau
      // wie im befüllten Zustand, da renderSheetTable() unten dieselbe
      // Funktion mit denselben CSS-Klassen ist) — plus der Hinweistext als
      // Overlay (siehe .pivot-empty-hint). Über der Filterzeile (falls
      // vorhanden, oben schon gebaut) hinaus mit leeren Zeilen auffüllen.
      //
      // canvas.clientWidth ist schon vor jedem Tabelleninhalt korrekt, da
      // .sheet-wrap mit flex:1 (= flex-basis:0%) unabhängig vom eigenen
      // Inhalt auf die verfügbare Breite wächst — kein Zwei-Pass-Rendering
      // zum Nachmessen nötig.
      var emptyGridCols = Math.max(1, Math.ceil(canvas.clientWidth / 92));
      pivotColCount = Math.max(pivotColCount, filterFields.length ? 3 : 1, emptyGridCols);
      // Zeilen bis zur Mindesthöhe füllt der gemeinsame Schritt weiter unten
      // (MIN_VISIBLE_ROWS) — genau derselbe Mechanismus wie unten den
      // befüllten Zustand über die letzte Datenzeile hinaus mit Gitternetz
      // weiterlaufen lässt.
      showEmptyOverlay = true;
    } else {
      var data = getFilteredData();
      var hasValues = valueFields.length > 0;

      // Über das Zeilenbeschriftungen-Menü ausgeblendete Kombinationen wirken
      // wie ein echter Filter: die betroffenen Datenzeilen fallen schon hier
      // heraus, bevor Gruppierung/Aggregation/Summen darauf rechnen.
      if (rowFields.length && rowLabelHidden.length) {
        var rlHiddenSet = {};
        rowLabelHidden.forEach(function (k) { rlHiddenSet[k] = true; });
        data = data.filter(function (d) {
          var key = rowFields.map(function (f) { return fieldValue(f, d, dateGroupLevels).sort; }).join(" | ");
          return !rlHiddenSet[key];
        });
      }

      // Wertefilter ("Top"/"Unten" N) wirkt wie ein echter Datenfilter, bevor
      // überhaupt gruppiert wird — und bestimmt gleichzeitig die Anzeige-
      // reihenfolge (Top zuerst), siehe applyValueFilterToData().
      var rowOrderKeys = null;
      if (rowFields.length === 1 && valueFilter) {
        var vfResult = applyValueFilterToData(data, rowFields, dateGroupLevels, valueFilter);
        data = vfResult.data;
        rowOrderKeys = vfResult.orderKeys;
      }

      // Bei einem Zeilenfeld eine flache Liste (wie bisher), bei zwei oder
      // mehr eine ein-/ausklappbare Gliederung (siehe buildRowDisplayList()).
      var rowDisplay = buildRowDisplayList(rowFields, data, dateGroupLevels, rowLabelSortDir, rowOrderKeys);
      var colCombos = computeGroupCombos(colFields, data, dateGroupLevels);

      if (hasValues) {
        // Physische Spalten der Pivot-Ausgabe (ohne die Zeilenbeschriftungs-
        // Spalte) in exakt der Reihenfolge, in der sie in jeder Datenzeile
        // erscheinen — legt fest, welcher Spaltenbuchstabe zu welcher
        // Kombination/welchem Wertefeld gehört.
        var columnMeta = [];
        colCombos.forEach(function (cc) {
          valueFields.forEach(function (vf) { columnMeta.push({ combo: cc, vf: vf }); });
        });
        if (colFields.length) {
          valueFields.forEach(function (vf) { columnMeta.push({ combo: null, vf: vf }); }); // Gesamt-Spalte
        }

        // Für "Werte anzeigen als: % vom Gesamtergebnis" — bezogen auf den
        // Gesamtwert über ALLE Daten, nicht nur die jeweilige Spalte/Zeile.
        var grandTotals = {};
        valueFields.forEach(function (vf) {
          grandTotals[valueFieldKey(vf)] = aggregateForValueField(vf, data);
        });

        function colFilterFor(cm) {
          return function (rows) {
            return cm.combo ? rows.filter(function (d) { return rowMatchesCombo(d, colFields, cm.combo, dateGroupLevels); }) : rows;
          };
        }

        // Berechnet den in einer Datenzeile angezeigten Wert unter
        // Berücksichtigung von "Werte anzeigen als": jeder Modus braucht dafür
        // eine andere Vergleichsbasis (Gesamt / übergeordnete Zeile /
        // Vorgänger-Element / kumuliert bis hierhin) — siehe buildRowDisplayList()
        // für parentData/prevSiblingData/cumulativeData.
        function computeShownValue(vf, entry, cm) {
          var filterCol = colFilterFor(cm);
          var raw = aggregateForValueField(vf, filterCol(entry.data));
          if (vf.showAs === "percentOfTotal") {
            var gt = grandTotals[valueFieldKey(vf)];
            return gt ? (raw / gt) * 100 : 0;
          }
          if (vf.showAs === "percentOfParentRow") {
            var parentVal = aggregateForValueField(vf, filterCol(entry.parentData || data));
            return parentVal ? (raw / parentVal) * 100 : 0;
          }
          if (vf.showAs === "differenceFrom" || vf.showAs === "percentDifferenceFrom") {
            if (!entry.prevSiblingData) return null; // erstes Element: kein Vorgänger, wie in echtem Excel leer
            var prevVal = aggregateForValueField(vf, filterCol(entry.prevSiblingData));
            if (vf.showAs === "differenceFrom") return raw - prevVal;
            return prevVal ? ((raw - prevVal) / prevVal) * 100 : null;
          }
          if (vf.showAs === "runningTotal") {
            return aggregateForValueField(vf, filterCol(entry.cumulativeData || entry.data));
          }
          return raw;
        }

        var firstDataRow = rowOffset + 3; // + die beiden Kopfzeilen
        var lastDataRow = rowOffset + 2 + rowDisplay.length;
        var totalRowNum = lastDataRow + 1;
        var anchorCell = "$" + columnLetter(1) + "$" + firstDataRow;

        // Kopfzeile 1: Spaltenkombination je Wertefeld-Gruppe (pivot-header-row
        // je Zelle statt pro Zeile vergeben — die Zeile enthält auch die
        // Zeilenbeschriftungs-Spalte, die ihr neutrales Grau behalten soll,
        // nicht das Blau der Pivot-Kopfzeile.)
        var headerRow1 = [{ header: true, cls: "rowlabel pivot-header-row", html: rowFields.length ? rowFields.map(function (f) { return fieldAxisLabel(f, dateGroupLevels); }).join(" / ") : "" }];
        colCombos.forEach(function (cc) {
          headerRow1.push({ header: true, colspan: valueFields.length, cls: "pivot-header-row", html: cc.label });
        });
        if (colFields.length) headerRow1.push({ header: true, colspan: valueFields.length, cls: "pivot-header-row", html: "Gesamt" });
        headerRow1.push({ html: "", cls: "sheet-gap" }); // Trennspalte zum Feldbereich rechts
        pivotRows.push(headerRow1);

        // Kopfzeile 2: Wertefeld/Aggregation je Spalte. Die Zelle links davon
        // (unter dem Zeilenfeldnamen aus Kopfzeile 1) bleibt in echtem Excel
        // nicht leer, sondern zeigt "Zeilenbeschriftungen" mit Filterknopf.
        var headerRow2 = [{
          header: true,
          cls: "rowlabel pivot-header-row" + (rowFields.length ? " rowlabel-filter-cell" : ""),
          html: rowFields.length ? 'Zeilenbeschriftungen <span class="pivot-filter-btn"></span>' : ""
        }];
        columnMeta.forEach(function (cm) {
          var vfSuffix = showAsLabelSuffix(cm.vf);
          var vfLabel = (FIELDS[cm.vf.field].calculated ? cm.vf.field : cm.vf.agg + " von " + cm.vf.field) + vfSuffix;
          // Lange "Werte anzeigen als"-Zusätze (z.B. "(% vom übergeordneten
          // Zeilenergebnis)") würden als einzeilige nowrap-Beschriftung die
          // Spalte auf 300px+ aufblähen und mit Nachbarspalten kollidieren —
          // pivot-vf-header deckelt die Breite dafür und schneidet mit
          // Ellipsis ab (voller Text bleibt per Tooltip abrufbar). Nur dann
          // anwenden, wenn ein Zusatz tatsächlich vorhanden ist: ohne Zusatz
          // ("Summe von Umsatz" o.ä.) ist die feste 130px-Breite oft schon zu
          // knapp und schneidet sonst unnötig auch kurze Beschriftungen ab.
          headerRow2.push({
            header: true,
            cls: "pivot-header-row" + (vfSuffix ? " pivot-vf-header" : ""),
            html: vfLabel,
            attrs: vfSuffix ? ' title="' + escapeAttr(vfLabel) + '"' : ""
          });
        });
        headerRow2.push({ html: "", cls: "sheet-gap" });
        pivotRows.push(headerRow2);

        // Datenzeilen — bei mehreren Zeilenfeldern inkl. ein-/ausklappbarer
        // Gruppenzeilen (mit Zwischensumme statt eines Einzelwerts).
        rowDisplay.forEach(function (entry, rIdx) {
          var worksheetRow = firstDataRow + rIdx;
          var rowMatched = entry.data;
          var dataRow = [{ cls: rowDisplayCellCls(entry), html: rowDisplayLabelHtml(entry) }];
          columnMeta.forEach(function (cm, cIdx) {
            var colLetter = columnLetter(cIdx + 2);
            var val = computeShownValue(cm.vf, entry, cm);
            var filterParts = entry.parts.concat(cm.combo ? cm.combo.parts : []);
            var formula = pivotDataFormula(cm.vf.field, filterParts, anchorCell);
            dataRow.push({
              html: formatAggResult(cm.vf.agg, cm.vf.field, val, cm.vf.showAs),
              cls: "sheet-cell--value" + (entry.isGroup ? " row-group-subtotal" : ""),
              attrs: ' data-addr="' + colLetter + worksheetRow + '" data-formula="' + escapeAttr(formula) + '"' +
                ' data-vf-field="' + escapeAttr(cm.vf.field) + '" data-vf-agg="' + escapeAttr(cm.vf.agg) + '" data-vf-id="' + escapeAttr(cm.vf.id) + '"'
            });
          });
          dataRow.push({ html: "", cls: "sheet-gap" });
          pivotRows.push(dataRow);
        });

        // Gesamtsumme-Zeile
        var totalRow = [{ cls: "rowlabel cell-total", html: "Gesamt" }];
        // "Differenz von"/"Laufende Summe in" haben in der Gesamtzeile keine
        // sinnvolle Vergleichsbasis mehr (bleibt leer); die beiden
        // %-Anteil-Modi ergeben dort denkgesetzlich immer 100 %, ohne
        // computeShownValue noch einmal eigens dafür aufzurufen.
        var POSITIONAL_SHOWAS_MODES = { differenceFrom: true, percentDifferenceFrom: true, runningTotal: true };
        columnMeta.forEach(function (cm, cIdx) {
          var colLetter = columnLetter(cIdx + 2);
          var colMatched = cm.combo ? data.filter(function (d) { return rowMatchesCombo(d, colFields, cm.combo, dateGroupLevels); }) : data;
          var val;
          if (POSITIONAL_SHOWAS_MODES[cm.vf.showAs]) val = null;
          else if (cm.vf.showAs === "percentOfTotal" || cm.vf.showAs === "percentOfParentRow") val = 100;
          else val = aggregateForValueField(cm.vf, colMatched);
          var formula = totalColumnFormula(cm.vf.agg, colLetter, firstDataRow, lastDataRow);
          totalRow.push({
            html: formatAggResult(cm.vf.agg, cm.vf.field, val, cm.vf.showAs),
            cls: "sheet-cell--value cell-total",
            attrs: ' data-addr="' + colLetter + totalRowNum + '" data-formula="' + escapeAttr(formula) + '"' +
              ' data-vf-field="' + escapeAttr(cm.vf.field) + '" data-vf-agg="' + escapeAttr(cm.vf.agg) + '"'
          });
        });
        totalRow.push({ html: "", cls: "sheet-gap" });
        pivotRows.push(totalRow);

        // +1: eine sichtbare Leerspalte als Abstand zum Feldbereich rechts.
        pivotColCount = 1 + columnMeta.length + 1;
      } else {
        // Noch kein Wertefeld: zeige trotzdem sofort die Gruppierungs-
        // Beschriftungen an (Zeilen- und/oder Spaltenwerte) — genau wie es
        // echtes Excel schon tut, bevor überhaupt ein Wertefeld gewählt wurde.
        var skColCombos = colFields.length ? colCombos : [];
        // +1: eine sichtbare Leerspalte als Abstand zum Feldbereich rechts.
        pivotColCount = 1 + skColCombos.length + 1;

        var skHeaderRow = [{ header: true, cls: "rowlabel pivot-header-row", html: rowFields.length ? rowFields.map(function (f) { return fieldAxisLabel(f, dateGroupLevels); }).join(" / ") : "" }];
        skColCombos.forEach(function (cc) { skHeaderRow.push({ header: true, cls: "pivot-header-row", html: cc.label }); });
        skHeaderRow.push({ html: "", cls: "sheet-gap" });
        pivotRows.push(skHeaderRow);

        if (rowFields.length) {
          rowDisplay.forEach(function (entry) {
            var skRow = [{ cls: rowDisplayCellCls(entry), html: rowDisplayLabelHtml(entry) }];
            skColCombos.forEach(function () { skRow.push({ html: "" }); });
            skRow.push({ html: "", cls: "sheet-gap" });
            pivotRows.push(skRow);
          });
          var skTotalRow = [{ cls: "rowlabel cell-total", html: "Gesamt" }];
          skColCombos.forEach(function () { skTotalRow.push({ cls: "cell-total", html: "" }); });
          skTotalRow.push({ html: "", cls: "sheet-gap" });
          pivotRows.push(skTotalRow);
        }
      }

      // Die Filterzeile braucht selbst 2 Spalten (Feldname + Wert) — plus eine
      // dahinter für die Trennspalte, sonst frisst der Filterwert die Lücke auf,
      // wenn die eigentliche Pivot-Ausgabe (z.B. nur Zeilen, keine Werte) schmaler
      // als 3 Spalten ist.
      pivotColCount = Math.max(pivotColCount, filterFields.length ? 3 : 1);
    }

    // Filterzeilen wurden ganz oben gebaut, bevor pivotColCount final feststand,
    // und haben daher u.U. weniger Zellen als die Kopf-/Datenzeilen (z.B. fehlt sonst
    // die Gitterlinie der neuen Trennspalte in der Filterzeile). Auf die
    // finale Breite auffüllen, sonst fehlen dort Zellen (und damit vertikale
    // Gitterlinien).
    function padPivotRowsTo(count) {
      pivotRows.forEach(function (row) {
        if (!row) return;
        var used = row.reduce(function (sum, c) { return sum + (c.colspan || 1); }, 0);
        while (used < count) {
          row.push({ html: "" });
          used++;
        }
      });
    }
    // Gitternetz auch unterhalb der letzten Daten-/Gesamtzeile weiterlaufen
    // lassen, statt dort abrupt in eine weiße Fläche überzugehen — genau wie
    // ein echtes, unbenutztes Excel-Blatt. Füllt nur auf, kürzt nie (bei
    // vielen Zeilenkombinationen bleiben es entsprechend mehr als
    // MIN_VISIBLE_ROWS Zeilen); die neuen Leerzeilen bekommen ihre Zellen
    // gleich mit über den padPivotRowsTo()-Aufruf direkt danach.
    var MIN_VISIBLE_ROWS = 28; // deckt die sichtbare Höhe (max-height 560px ≈ 20 Zeilen) komfortabel ab, Rest scrollbar wie in echtem Excel
    while (pivotRows.length < MIN_VISIBLE_ROWS) pivotRows.push([]);
    padPivotRowsTo(pivotColCount);

    // Im leeren Zustand ist pivotRows jetzt immer mit dem Blindraster
    // aufgefüllt (siehe oben) — renderSheetTable() bekommt daher immer
    // etwas zu rendern, der Hinweistext (siehe .pivot-empty-hint) schwebt
    // per position:absolute darüber. Bewusst ohne Richtungsangabe ("...
    // rechts") im Hinweistext selbst: je nach Container-Breite steht die
    // PivotTable-Feldliste rechts (≥900px) oder oberhalb (<900px, siehe
    // @container-Regel bei .excel-body) — "rechts" wäre dann falsch.
    canvas.innerHTML = renderSheetTable(pivotRows) +
      (showEmptyOverlay ? '<div class="pivot-empty-hint">Zieh Felder aus der PivotTable-Feldliste in die Bereiche Filter, Spalten, Zeilen oder Werte, um deine Pivot-Tabelle aufzubauen.</div>' : "");
    fixStickyOffsets(canvas);

    // Aktive Zelle: standardmäßig die Gesamtsumme unten rechts — didaktisch
    // der interessanteste Fall. Klick auf eine andere Datenzelle (siehe
    // persistenter Handler unten) aktualisiert Namensfeld und Formel.
    var valueCells = canvas.querySelectorAll(".sheet-cell--value");
    if (valueCells.length) {
      activateCell(valueCells[valueCells.length - 1]);
    } else {
      // Excel zeigt im Namenfeld immer einen Bezug — ohne Pivot-Werte steht die Auswahl auf A1
      document.getElementById("formula-namebox").textContent = "A1";
      document.getElementById("formula-text").textContent = "";
    }
  }

  document.getElementById("sheet-canvas").addEventListener("click", function (e) {
    var groupToggle = e.target.closest(".row-group-toggle");
    if (groupToggle) {
      var key = groupToggle.dataset.groupKey;
      collapsedRowGroups[key] = !collapsedRowGroups[key];
      renderPivot();
      return;
    }
    var filterCell = e.target.closest(".filter-value-cell");
    if (filterCell) {
      closeRowLabelFilterMenu();
      openFilterDropdown(filterCell, filterCell.dataset.filterField);
      return;
    }
    var rowLabelCell = e.target.closest(".rowlabel-filter-cell");
    if (rowLabelCell) {
      closeFilterDropdown();
      openRowLabelFilterMenu(rowLabelCell);
      return;
    }
    closeFilterDropdown();
    closeRowLabelFilterMenu();
    closeValueCellContextMenu();
    var cell = e.target.closest(".sheet-cell--value");
    if (cell) activateCell(cell);
  });

  document.getElementById("sheet-canvas").addEventListener("contextmenu", function (e) {
    var cell = e.target.closest(".sheet-cell--value");
    if (!cell) return;
    e.preventDefault();
    activateCell(cell);
    openValueCellContextMenu(cell, e.clientX, e.clientY);
  });

  function renderAll() {
    renderZones();
    renderPivot();
  }

  // ---------- Prüfen ----------
  // Statt starr zu prüfen, ob Felder in exakt der hinterlegten Zone liegen,
  // wird das vom Nutzer tatsächlich erzeugte Pivot-Ergebnis (Gruppierung +
  // Aggregation) berechnet und mit einer genauso berechneten Musterlösung
  // verglichen. Das akzeptiert automatisch jede inhaltlich gleichwertige
  // Lösung (z.B. Gruppierungsfeld in Spalten statt Zeilen, wenn
  // rowsColsInterchangeable gesetzt ist) und deckt gleichzeitig eine falsche
  // Aggregation ab, weil die berechneten Werte dann nicht mehr übereinstimmen.
  var feedbackEl = document.getElementById("feedback");

  function sameSet(a, b) {
    var as = a.slice().sort(), bs = b.slice().sort();
    return as.length === bs.length && as.every(function (v, i) { return v === bs[i]; });
  }

  // Wendet eine feste Filter-Zuordnung (Feld -> gewählter Wert) auf Daten an —
  // gebraucht, um sowohl die Schüler- als auch die Musterlösung mit der
  // jeweils tatsächlich gefilterten Datenmenge zu berechnen (nicht nur zu
  // prüfen, ob das richtige Feld im Filter-Bereich liegt, sondern auch, ob
  // der richtige Wert ausgewählt wurde).
  function applyFilterValues(data, filterFields, filterValueMap) {
    if (!filterFields.length) return data;
    return data.filter(function (d) {
      return filterFields.every(function (ff) {
        var sel = filterValueMap[ff];
        return !sel || filterFieldLabel(ff, d[ff]) === sel;
      });
    });
  }

  // Alle Permutationen eines (kurzen) Arrays — für rowsColsInterchangeable
  // bei zwei Gruppierungsfeldern: "Region in Zeilen + Land in Spalten" soll
  // genauso als richtig gelten wie "Land in Zeilen + Region in Spalten".
  function permutations(arr) {
    if (arr.length <= 1) return [arr];
    var result = [];
    arr.forEach(function (item, i) {
      var rest = arr.slice(0, i).concat(arr.slice(i + 1));
      permutations(rest).forEach(function (p) { result.push([item].concat(p)); });
    });
    return result;
  }

  // "% vom übergeordneten Zeilenergebnis" für die Bewertung: das
  // übergeordnete Element einer Kombination sind alle Datenzeilen, die in
  // den Gruppierungsfeldern OHNE das letzte Feld übereinstimmen (eine
  // Beispielzeile aus "matched" reicht, um deren Werte zu kennen).
  function computeParentData(matched, data, groupFields, levelsMap) {
    if (groupFields.length <= 1 || !matched.length) return data;
    var parentFields = groupFields.slice(0, -1);
    var sample = matched[0];
    return data.filter(function (d) {
      return parentFields.every(function (f) { return fieldValue(f, d, levelsMap).sort === fieldValue(f, sample, levelsMap).sort; });
    });
  }

  // Eindeutiger Schlüssel für ein Wertefeld-Eintrag beim Vergleich Schüler-
  // vs. Musterlösung. Reines "agg:feldname" reicht aus zwei Gründen nicht:
  // (a) dasselbe Feld kann mehrfach in "Werte" liegen (z.B. Umsatz einmal als
  // "Differenz von", einmal als "% Differenz von" — siehe "Umsatzveränderung
  // zum Vorjahr") und würde sonst denselben Schlüssel erzeugen und sich
  // gegenseitig überschreiben; (b) ein berechnetes Feld kann von Schüler und
  // Musterlösung unter komplett unterschiedlichem Namen angelegt sein (die
  // Übung registriert dafür ein verstecktes "referenceCalcFields"-Pendant,
  // siehe openExercise()) — dort muss die FORMEL zählen (in kanonischer,
  // whitespace-unabhängiger Form, siehe serializeFormulaAst()), nicht der
  // frei gewählte Name.
  function valueFieldKey(vf) {
    var cf = calculatedFields[vf.field];
    var fieldPart = cf ? ("calc:" + serializeFormulaAst(cf.ast)) : vf.field;
    return vf.agg + ":" + fieldPart + (vf.showAs ? ":" + vf.showAs : "");
  }

  function computeFlatResultSet(groupFields, valueFields, data, levelsMap) {
    var combos = computeGroupCombos(groupFields, data, levelsMap);
    var matchedList = combos.map(function (combo) {
      return groupFields.length ? data.filter(function (d) { return rowMatchesCombo(d, groupFields, combo, levelsMap); }) : data;
    });
    // Gesamtwert je Wertefeld über die komplette (schon gefilterte) Datenmenge
    // — Grundlage für vf.showAs "percentOfTotal", siehe renderPivot()s
    // computeShownValue() für dieselbe Logik in der Anzeige.
    var grandTotals = {};
    valueFields.forEach(function (vf) {
      grandTotals[valueFieldKey(vf)] = aggregateForValueField(vf, data);
    });
    return combos.map(function (combo, i) {
      var matched = matchedList[i];
      var values = {};
      valueFields.forEach(function (vf) {
        var raw = aggregateForValueField(vf, matched);
        var val;
        if (vf.showAs === "percentOfTotal") {
          var gt = grandTotals[valueFieldKey(vf)];
          val = gt ? (raw / gt) * 100 : 0;
        } else if (vf.showAs === "percentOfParentRow") {
          var parentVal = aggregateForValueField(vf, computeParentData(matched, data, groupFields, levelsMap));
          val = parentVal ? (raw / parentVal) * 100 : 0;
        } else if (vf.showAs === "differenceFrom" || vf.showAs === "percentDifferenceFrom") {
          if (i === 0) {
            val = null; // erstes Element: kein Vorgänger, wie in echtem Excel leer
          } else {
            var prevVal = aggregateForValueField(vf, matchedList[i - 1]);
            val = vf.showAs === "differenceFrom" ? (raw - prevVal) : (prevVal ? ((raw - prevVal) / prevVal) * 100 : null);
          }
        } else if (vf.showAs === "runningTotal") {
          var cumData = [];
          for (var j = 0; j <= i; j++) cumData = cumData.concat(matchedList[j]);
          val = aggregateForValueField(vf, cumData);
        } else {
          val = raw;
        }
        values[valueFieldKey(vf)] = val;
      });
      return { key: combo.key, values: values };
    });
  }

  function resultSetsEqual(a, b) {
    if (a.length !== b.length) return { equal: false, reason: "count" };
    for (var i = 0; i < a.length; i++) {
      if (a[i].key !== b[i].key) return { equal: false, reason: "count" };
      var ak = Object.keys(a[i].values), bk = Object.keys(b[i].values);
      if (ak.length !== bk.length) return { equal: false, reason: "values" };
      for (var j = 0; j < ak.length; j++) {
        var k = ak[j];
        if (!(k in b[i].values) || Math.abs(a[i].values[k] - b[i].values[k]) > 0.01) {
          return { equal: false, reason: "values" };
        }
      }
    }
    return { equal: true };
  }

  function checkSolution() {
    var sol = currentExercise.solution;

    if (zones.values.length === 0) {
      return { correct: false, messages: ["Es fehlt noch ein Feld im Bereich „Werte“."] };
    }
    if (zones.rows.length === 0 && zones.columns.length === 0) {
      return { correct: false, messages: ["Ziehe mindestens ein Gruppierungsfeld in „Zeilen“ oder „Spalten“."] };
    }

    if (!sol.rowsColsInterchangeable) {
      var rowsOk = sameSet(zones.rows, sol.rows);
      var columnsOk = sameSet(zones.columns, sol.columns);
      if (!rowsOk || !columnsOk) {
        return { correct: false, messages: ["Bei dieser Aufgabe ist wichtig, welches Feld in „Zeilen“ und welches in „Spalten“ liegt — prüfe die Zuordnung."] };
      }
    }

    if (!sameSet(zones.filter, sol.filter)) {
      return { correct: false, messages: ["Der Bereich „Filter“ passt noch nicht (evtl. wird er für diese Aufgabe gar nicht gebraucht)."] };
    }

    var studentFields = zones.rows.concat(zones.columns);
    var targetFieldsBase = sol.rows.concat(sol.columns);
    var studentData = applyFilterValues(DATA, zones.filter, filterSelections);
    studentData = applyValueFilterToData(studentData, zones.rows, dateGroupLevels, valueFilter).data;
    var targetData = applyFilterValues(DATA, sol.filter, sol.filterValues || {});
    targetData = applyValueFilterToData(targetData, sol.rows, sol.dateGroupLevels || {}, sol.valueFilter || null).data;
    var studentResult = computeFlatResultSet(studentFields, zones.values, studentData, dateGroupLevels);

    // Bei rowsColsInterchangeable zählt jede Reihenfolge der Gruppierungs-
    // felder als richtig (Zeilen/Spalten dürfen vertauscht UND ihre Felder
    // in beliebiger Kombination verteilt sein) — daher gegen alle
    // Permutationen der Musterlösung vergleichen und die beste nehmen.
    var targetFieldOrders = sol.rowsColsInterchangeable ? permutations(targetFieldsBase) : [targetFieldsBase];
    var comparison = { equal: false, reason: "count" };
    for (var oi = 0; oi < targetFieldOrders.length; oi++) {
      var targetResult = computeFlatResultSet(targetFieldOrders[oi], sol.values, targetData, sol.dateGroupLevels || {});
      var cmp = resultSetsEqual(studentResult, targetResult);
      comparison = cmp;
      // Ein "values"-Mismatch (falsches/fehlendes Wertefeld) liegt an der
      // WERTE-Zone, nicht an der Reihenfolge der Gruppierungsfelder — weitere

      // Permutationen können das nie beheben, würden hier aber ggf. zufällig
      // in einen "count"-Mismatch umschlagen (durch die geänderte Sortier-
      // priorität) und so eine irreführende Fehlermeldung erzeugen. Deshalb
      // bei "values" sofort stoppen und diese (korrekte) Diagnose behalten.
      if (cmp.equal || cmp.reason === "values") break;
    }

    if (!comparison.equal) {
      if (comparison.reason === "count") {
        var hasDateField = studentFields.some(function (f) { return FIELDS[f].type === "date"; });
        var hint = hasDateField
          ? " Prüfe, welche Felder du zur Gruppierung genutzt hast bzw. welche Gruppierungsstufe (Jahr/Quartal/Monat/Tag) beim Datumsfeld eingestellt ist."
          : " Prüfe, welche Felder du zur Gruppierung genutzt hast.";
        // Gleiche Anzahl Gruppen, aber unterschiedliche Kombinationen (z.B.
        // nur Region statt Region+Land) — dann passt die Formulierung
        // "andere Anzahl" nicht, auch wenn intern derselbe Vergleichspfad
        // (reason "count") greift.
        var countMsg = studentResult.length === targetResult.length
          ? "Deine Gruppierung ergibt zwar gleich viele Gruppen, aber nicht dieselben Kombinationen wie erwartet."
          : "Deine Gruppierung ergibt eine andere Anzahl an Gruppen als erwartet (" + studentResult.length + " statt " + targetResult.length + ").";
        return { correct: false, messages: [countMsg + hint] };
      }
      return { correct: false, messages: ["Die berechneten Werte stimmen noch nicht mit der Musterlösung überein. Prüfe Feld <em>und</em> Aggregation im Bereich „Werte“."] };
    }

    return { correct: true, messages: ["Richtig! 🎉 Deine Pivot-Tabelle liefert genau das erwartete Ergebnis."] };
  }

  // ---------- Erfolgs-Popup bei richtiger Lösung (1:1 aus dem Übungsportal
  // übernommen: gleiches Markup/CSS/Timing, siehe assets/engine.js) ----------
  var SUCCESS_MESSAGES = ["Klasse gemacht!", "Stark gelöst!", "Sehr gut!", "Läuft bei dir!"];

  function buildConfetti() {
    var colors = ["#107C41", "#0B5C30", "#FFC107", "#2F80ED", "#EB5757"];
    var frag = document.createDocumentFragment();
    for (var i = 0; i < 14; i++) {
      var dot = document.createElement("span");
      dot.className = "success-popup__confetti";
      var angle = Math.random() * Math.PI * 2;
      var dist = 55 + Math.random() * 55;
      dot.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      dot.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      dot.style.setProperty("--rot", Math.round(Math.random() * 360) + "deg");
      dot.style.background = colors[i % colors.length];
      dot.style.animationDelay = Math.random() * 0.15 + "s";
      frag.appendChild(dot);
    }
    return frag;
  }

  // Geteilt zwischen Erfolgs- UND Fehler-Popup: ein neuer Klick auf "Prüfen"
  // soll ein noch offenes Popup der jeweils anderen Art zuverlässig schließen
  // statt es stehen zu lassen.
  var activePopupOverlay = null;

  // anchorEl: Element, auf dessen Höhe/Breite das Popup zentriert wird (hier
  // die Tabelle #sheet-canvas) — "position: absolute" mit aus der Bounding-Box
  // berechneten Koordinaten statt "position: fixed", genau wie im
  // Übungsportal, damit es mittig über der Tabelle sitzt statt über die ganze
  // Seite/den ganzen Viewport gelegt zu werden.
  // Legt das abgedunkelte Overlay exakt über die Tabelle — ohne Überstand. (Das
  // Übungsportal nutzt 24px Rand, weil seine Tabelle frei auf der Seite steht; hier
  // liegt #sheet-canvas bündig im Excel-Fenster, ein Rand ragte über dessen Kanten,
  // die Bearbeitungsleiste und die Feldliste und wirkte versetzt.) Wo die Tabelle an
  // eine Ecke des Fensters stößt, übernimmt das Overlay dessen Rundung.
  function positionPopupOverlay(overlay, anchorEl) {
    var target = (anchorEl && anchorEl.getBoundingClientRect) ? anchorEl : document.body;
    var rect = target.getBoundingClientRect();
    var scrollX = window.pageXOffset || document.documentElement.scrollLeft;
    var scrollY = window.pageYOffset || document.documentElement.scrollTop;

    overlay.style.left = (rect.left + scrollX) + "px";
    overlay.style.top = (rect.top + scrollY) + "px";
    overlay.style.width = rect.width + "px";
    overlay.style.height = rect.height + "px";

    var win = target.closest ? target.closest(".excel-window") : null;
    if (!win) return;
    var winRect = win.getBoundingClientRect();
    var radius = getComputedStyle(win).borderTopLeftRadius;
    function corner(v, h) {
      return Math.abs(rect[v] - winRect[v]) < 3 && Math.abs(rect[h] - winRect[h]) < 3 ? radius : "0";
    }
    overlay.style.borderRadius = [corner("top", "left"), corner("top", "right"), corner("bottom", "right"), corner("bottom", "left")].join(" ");
  }

  function showSuccessPopup(anchorEl) {
    if (activePopupOverlay) activePopupOverlay.remove();

    var overlay = document.createElement("div");
    overlay.className = "success-popup-overlay";
    positionPopupOverlay(overlay, anchorEl);

    var popup = document.createElement("div");
    popup.className = "success-popup";
    var message = SUCCESS_MESSAGES[Math.floor(Math.random() * SUCCESS_MESSAGES.length)];
    popup.innerHTML =
      '<svg class="success-popup__check" viewBox="0 0 52 52" width="64" height="64">' +
      '<circle class="success-popup__check-circle" cx="26" cy="26" r="24" fill="none"/>' +
      '<path class="success-popup__check-mark" fill="none" d="M14 27l7 7 16-16"/>' +
      "</svg>" +
      '<p class="success-popup__title">' + escapeAttr(message) + "</p>" +
      '<p class="success-popup__subtitle">Du hast die Übung richtig gelöst.</p>';
    popup.appendChild(buildConfetti());
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    activePopupOverlay = overlay;

    function close() {
      overlay.removeEventListener("click", close);
      overlay.remove();
      if (activePopupOverlay === overlay) activePopupOverlay = null;
    }
    overlay.addEventListener("click", close);
    setTimeout(close, 3200);
  }

  // Fehler-Popup bei falscher Lösung — gleiches Muster wie showSuccessPopup(),
  // aber ohne automatisches Schließen (der Text soll tatsächlich gelesen
  // werden können) und mit den konkreten Prüf-Meldungen als Inhalt statt
  // eines generischen Lobs.
  function showErrorPopup(anchorEl, messages) {
    if (activePopupOverlay) activePopupOverlay.remove();

    var overlay = document.createElement("div");
    overlay.className = "error-popup-overlay";
    positionPopupOverlay(overlay, anchorEl);

    var popup = document.createElement("div");
    popup.className = "error-popup";
    popup.innerHTML =
      '<svg class="error-popup__icon" viewBox="0 0 52 52" width="64" height="64">' +
      '<circle class="error-popup__icon-circle" cx="26" cy="26" r="24" fill="none"/>' +
      '<path class="error-popup__icon-cross" fill="none" d="M17 17l18 18M35 17l-18 18"/>' +
      "</svg>" +
      '<p class="error-popup__title">Noch nicht ganz</p>' +
      '<div class="error-popup__subtitle"><ul><li>' + messages.join("</li><li>") + "</li></ul></div>";
    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    activePopupOverlay = overlay;

    function close() {
      overlay.removeEventListener("click", close);
      overlay.remove();
      if (activePopupOverlay === overlay) activePopupOverlay = null;
    }
    overlay.addEventListener("click", close);
  }

  document.getElementById("btn-check").addEventListener("click", function () {
    var result = checkSolution();
    melde("pruefung", { richtig: !!result.correct });

    // Feldbelegung mitschicken: zeigt später, welche falschen Lösungswege häufig sind
    trackStats.attempts++;
    trackEvent("check", {
      correct: !!result.correct,
      attempt: trackStats.attempts,
      seconds: Math.round((Date.now() - trackStats.openedAt) / 1000),
      zones: {
        filter: zones.filter,
        columns: zones.columns,
        rows: zones.rows,
        values: zones.values.map(function (v) { return v.field + ":" + v.agg; })
      }
    });

    feedbackEl.classList.remove("correct", "incorrect");
    feedbackEl.classList.add("show", result.correct ? "correct" : "incorrect");

    if (result.correct) {
      feedbackEl.innerHTML = result.messages[0];
      showSuccessPopup(document.getElementById("sheet-canvas"));
    } else {
      feedbackEl.innerHTML = "Noch nicht ganz:<ul><li>" + result.messages.join("</li><li>") + "</li></ul>";
      showErrorPopup(document.getElementById("sheet-canvas"), result.messages);
    }
  });

  document.getElementById("btn-reset").addEventListener("click", function () {
    resetExerciseState();
    renderFieldList();
    renderAll();
    trackEvent("reset");
  });

  document.getElementById("data-source-toggle").addEventListener("click", function () {
    var box = document.getElementById("data-source-box");
    var open = box.hidden;
    box.hidden = !open;
    this.textContent = open ? "Datenquelle ausblenden" : "Datenquelle anzeigen";
    if (open) trackEvent("data_source_open");
  });

  document.getElementById("data-model-checkbox").addEventListener("change", function () {
    addedToDataModel = this.checked;
    renderZones(); // aktualisiert die Aggregations-Auswahl im Werte-Chip
  });

  document.getElementById("ribbon-fields-groups-btn").addEventListener("click", function (e) {
    e.stopPropagation();
    openRibbonMenu();
  });

  openExercise(currentExercise);
  melde("bereit", {});
};
</script>
<script>
  // Aufgabe aus derselben Datendatei wie die Übungsseite laden, dann starten.
  fetch("daten/aufgaben.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(function (daten) {
      var aufgabe = daten.aufgaben.filter(function (a) { return a.typ === "pivot"; })[0];
      window.starteExcelFloPivot(aufgabe);
    });
</script>

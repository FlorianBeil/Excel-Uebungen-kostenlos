<!DOCTYPE html>
<!-- Vorlage für das Link-Vorschaubild (1200×630). Erzeugen: skripte/og-bild-erzeugen.ps1 -->
<html lang="de">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Inter", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #107C41 0%, #0B5C30 100%);
    color: #fff;
    display: flex;
    align-items: center;
    padding: 0 70px;
    box-sizing: border-box;
    gap: 56px;
  }
  .text { flex: 1 1 0; }
  .marke { display: flex; align-items: center; gap: 14px; font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 34px; margin-bottom: 44px; }
  .marke img { width: 54px; height: 54px; }
  .marke .punkt { color: #FFC107; }
  h1 { font-family: "Space Grotesk", sans-serif; font-weight: 700; font-size: 74px; line-height: 1.02; margin: 0 0 24px; letter-spacing: -0.5px; }
  .unter { font-size: 32px; font-weight: 600; margin: 0 0 30px; opacity: 0.95; }
  .fakten { display: inline-flex; gap: 12px; }
  .fakten span { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.35); border-radius: 999px; padding: 9px 20px; font-size: 23px; font-weight: 600; }

  .blatt { flex: 0 0 420px; background: #fff; border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.28); overflow: hidden; color: #1F2A24; font-family: "Segoe UI", Arial, sans-serif; }
  .leiste { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid #E1E5E2; font-size: 19px; }
  .namenfeld { border: 1px solid #C8C8C8; border-radius: 4px; padding: 3px 10px; min-width: 44px; }
  .fx { font-family: Georgia, serif; font-style: italic; color: #5B6B63; }
  .formel { border: 1px solid #C8C8C8; border-radius: 4px; padding: 3px 10px; flex: 1; white-space: nowrap; overflow: hidden; font-size: 17px; }
  .formel b { color: #107C41; font-weight: 600; }
  table { border-collapse: collapse; width: 100%; font-size: 21px; }
  th { background: #F5F5F5; color: #5B6B63; font-weight: 400; font-size: 16px; padding: 5px; border: 1px solid #E1E1E1; }
  td { border: 1px solid #E1E1E1; padding: 9px 12px; height: 26px; }
  td.nr { background: #F5F5F5; color: #5B6B63; font-size: 16px; text-align: center; width: 30px; padding: 0; }
  td.kopf { font-weight: 700; }
  td.zahl { text-align: right; }
  td.ziel { background: #E9F6EE; outline: 3px solid #107C41; outline-offset: -3px; text-align: right; font-weight: 700; color: #0B5C30; }
</style>
</head>
<body>
  <div class="text">
    <div class="marke"><img src="../assets/geteilt/img/logo-white.webp" alt=""><span>Excel<span class="punkt">.</span>Flo</span></div>
    <h1>Kannst du Excel wirklich?</h1>
    <p class="unter">5 Aufgaben – direkt im Browser</p>
    <div class="fakten"><span>Kein Download</span><span>Keine Anmeldung</span></div>
  </div>
  <div class="blatt" aria-hidden="true">
    <div class="leiste"><span class="namenfeld">B6</span><span class="fx">fx</span><span class="formel">=<b>SVERWEIS</b>(B5;A2:B4;2;FALSCH)</span></div>
    <table>
      <tr><th></th><th>A</th><th>B</th></tr>
      <tr><td class="nr">1</td><td class="kopf">Produkt</td><td class="kopf zahl">Preis</td></tr>
      <tr><td class="nr">2</td><td>Maus</td><td class="zahl">19,99 €</td></tr>
      <tr><td class="nr">3</td><td>Tastatur</td><td class="zahl">34,99 €</td></tr>
      <tr><td class="nr">4</td><td>Monitor</td><td class="zahl">189,00 €</td></tr>
      <tr><td class="nr">5</td><td>Suchwert</td><td>Tastatur</td></tr>
      <tr><td class="nr">6</td><td>Preis</td><td class="ziel">34,99 € ✓</td></tr>
    </table>
  </div>
</body>
</html>
